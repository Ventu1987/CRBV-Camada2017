<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Regatas M9">
<title>Regatas M9 · Camada 2017</title>
<link rel="icon" href="escudo.png">
<link rel="apple-touch-icon" href="escudo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{
  --bg:#0b1222; --bg2:#111b30; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --tx:#f1f5f9; --tx2:#cbd5e1; --tx3:#94a3b8; --tx4:#64748b;
  --cy:#06b6d4; --cy2:#0891b2; --vi:#8b5cf6; --vi2:#c4b5fd; --gr:#22c55e; --gr2:#86efac; --rd:#ef4444; --rd2:#fca5a5; --am:#f59e0b; --am2:#fcd34d;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',system-ui,sans-serif;background:linear-gradient(160deg,#0b1222 0%,#132039 60%,#0f172a 100%) fixed;background-color:var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.4;padding-bottom:84px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);background:rgba(6,182,212,.08)}
select option{background:#1e293b}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.muted{color:var(--tx3)} .small{font-size:.8rem} .tiny{font-size:.72rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem .9rem}
.kpi .l{font-size:.75rem;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:1.7rem;font-weight:800;margin-top:.15rem;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.75rem;color:var(--tx3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:12px}
.card h3{font-size:1rem;font-weight:800;margin-bottom:.7rem;display:flex;align-items:center;gap:.45rem}
.card h3 .sp{flex:1}
h2.sec{font-size:1.35rem;font-weight:900;margin:18px 0 12px;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
h2.sec .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem .9rem;border-radius:10px;border:1px solid var(--line2);background:transparent;font-weight:700;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:linear-gradient(135deg,var(--cy),var(--cy2));border:none;color:#04131a}
.btn.vio{background:linear-gradient(135deg,var(--vi),#7c3aed);border:none}
.btn.grn{background:linear-gradient(135deg,var(--gr),#16a34a);border:none;color:#04150a}
.btn.red{border-color:rgba(239,68,68,.5);color:var(--rd2)}
.btn.sm{padding:.4rem .6rem;font-size:.8rem;border-radius:8px}
.btn.on{border:2px solid var(--cy);background:rgba(6,182,212,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:none;padding:.5rem .8rem;font-weight:700;font-size:.85rem;color:var(--tx2)}
.seg button.on{background:rgba(6,182,212,.18);color:#a5f3fc}
.pill{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.lv{padding:.15rem .5rem;border-radius:6px;font-size:.72rem;font-weight:800;white-space:nowrap}
.lv-G{background:rgba(168,85,247,.22);color:#d8b4fe}.lv-1{background:rgba(34,197,94,.2);color:#86efac}.lv-2{background:rgba(59,130,246,.2);color:#93c5fd}.lv-3{background:rgba(239,68,68,.2);color:#fca5a5}
.t-MIE{background:rgba(6,182,212,.18);color:#67e8f9}.t-SAB{background:rgba(139,92,246,.22);color:#ddd6fe}.t-PAR{background:rgba(245,158,11,.2);color:#fcd34d}.t-OTR{background:rgba(148,163,184,.2);color:#cbd5e1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:.5rem .55rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);background:rgba(255,255,255,.03);position:sticky;top:0;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.clk{cursor:pointer}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dP{background:var(--gr)}.dA{background:var(--rd)}.dN{background:rgba(255,255,255,.12)}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(11,18,34,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.7rem;height:56px}
.top img{width:34px;height:34px;object-fit:contain}
.top .t1{font-weight:900;font-size:1rem;line-height:1.1}
.top .t2{font-size:.72rem;color:var(--cy);font-weight:700}
.sync{font-size:.72rem;color:var(--tx3);display:flex;align-items:center;gap:.3rem}
.top .t1,.top .t2{white-space:nowrap}
@media(max-width:420px){#syncTxt{display:none}}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gr);display:inline-block}
.sync.busy i{background:var(--am);animation:pulse 1s infinite}.sync.err i{background:var(--rd)}
@keyframes pulse{50%{opacity:.3}}
.tabs-top{display:none;gap:4px;margin-left:auto}
.tabs-top button{background:transparent;border:none;padding:.5rem .75rem;border-radius:8px;font-weight:700;color:var(--tx2);font-size:.9rem}
.tabs-top button.on{background:rgba(6,182,212,.15);color:#a5f3fc}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(11,18,34,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:none;padding:.5rem 0 .55rem;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;color:var(--tx3)}
.nav button span{font-size:1.25rem;line-height:1}
.nav button.on{color:#67e8f9}
@media(min-width:900px){.tabs-top{display:flex}.nav{display:none}body{padding-bottom:30px}}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 0 18px}
.hero img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(6,182,212,.25))}
.hero h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:900;margin-top:10px;letter-spacing:-.02em}
.hero .sub{font-size:clamp(1rem,3.5vw,1.25rem);font-weight:800;color:var(--cy);margin-top:2px}
.hero .chips{display:flex;gap:.4rem;margin-top:10px;flex-wrap:wrap;justify-content:center}
.hero .chips span{padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line2);font-size:.8rem;font-weight:700;color:var(--tx2)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;text-align:left;font-weight:800;font-size:.95rem}
.qa button small{display:block;color:var(--tx3);font-weight:500;font-size:.75rem;margin-top:2px}
.qa button:hover{border-color:var(--cy)}
.alert{display:flex;gap:.6rem;align-items:center;padding:.55rem .7rem;border-radius:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);margin-bottom:6px;font-size:.88rem}
.alert.am{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25)}
.list-i{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:none}

/* asistencia */
.att-head{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.att-head .full{grid-column:1/-1}
@media(min-width:700px){.att-head{grid-template-columns:160px 170px 1fr}.att-head .full{grid-column:auto}}
.att-tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:10px 0}
.att-list{display:flex;flex-direction:column;gap:6px}
.att{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem .6rem}
.att.P{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.06)}
.att.A{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.06)}
.att .main{display:flex;align-items:center;gap:.5rem}
.att .nm{flex:1;min-width:0}
.att .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .nm small{color:var(--tx4);font-size:.72rem}
.sb{width:40px;height:38px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-weight:900;font-size:1rem;flex-shrink:0}
.sb.p.on{background:var(--gr);border-color:var(--gr);color:#04150a}
.sb.a.on{background:var(--rd);border-color:var(--rd);color:#fff}
.cb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:.95rem;flex-shrink:0;color:var(--tx3)}
.cb.up.on{background:rgba(34,197,94,.25);border-color:var(--gr);color:var(--gr2)}
.cb.dn.on{background:rgba(239,68,68,.25);border-color:var(--rd);color:var(--rd2)}
.cb.cm.on{background:rgba(245,158,11,.2);border-color:var(--am);color:var(--am2)}
.att .cmt{margin-top:.45rem}
.stick{position:sticky;bottom:72px;z-index:40;margin-top:12px;background:rgba(17,27,48,.96);border:1px solid var(--line2);border-radius:14px;padding:.6rem .7rem;display:flex;gap:.6rem;align-items:center;backdrop-filter:blur(10px)}
@media(min-width:900px){.stick{bottom:12px}}
.cnt b{font-variant-numeric:tabular-nums}

/* equipos */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.team{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.team.over{border-color:var(--cy);background:rgba(6,182,212,.08)}
.team .th{padding:.7rem .85rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem}
.team .th h4{font-size:1.02rem;font-weight:800;color:#67e8f9;flex:1}
.team .ts{font-size:.78rem;color:var(--tx3);display:flex;gap:.6rem}
.team .tb{padding:.7rem .85rem}
.coaches{background:rgba(139,92,246,.13);border-left:4px solid var(--vi);border-radius:8px;padding:.5rem .6rem;margin-bottom:.6rem}
.coaches strong{font-size:.75rem;color:#e9d5ff;display:block;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .55rem;margin:2px;border-radius:7px;background:rgba(139,92,246,.18);color:#ede9fe;font-size:.82rem;font-weight:600;cursor:grab;border:1px solid transparent}
.pl{display:flex;align-items:center;gap:.45rem;padding:.42rem .45rem;border-radius:8px;cursor:grab;border:1px solid transparent}
.pl:hover{background:rgba(255,255,255,.05)}
.pl .n{color:#a78bfa;font-weight:800;min-width:20px;font-size:.8rem}
.pl .nm{flex:1;min-width:0;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{display:block;color:var(--tx4);font-size:.7rem;font-weight:500}
.sel{border-color:var(--am)!important;background:rgba(245,158,11,.14)!important}
.moveto{width:100%;margin-top:.5rem;padding:.5rem;border-radius:8px;border:1px dashed var(--am);background:rgba(245,158,11,.08);color:var(--am2);font-weight:800}
.warn{padding:.6rem .75rem;border-radius:10px;background:rgba(251,146,60,.1);color:#fb923c;font-size:.85rem;margin-top:8px}
.info{padding:.6rem .75rem;border-radius:10px;background:rgba(129,230,217,.08);color:#81e6d9;font-size:.85rem}
.ckl{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:.35rem}
.ckl label{display:flex;gap:.5rem;align-items:center;padding:.3rem .35rem;font-size:.86rem;cursor:pointer;border-radius:6px}
.ckl label:hover{background:rgba(255,255,255,.04)}
.ckl input{width:auto}
.nums{display:flex;gap:6px;flex-wrap:wrap}
.nums button{width:40px;height:38px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-weight:800}
.nums button.on{border:2px solid var(--cy);background:rgba(6,182,212,.12)}

/* gira */
.gira-hero{background:linear-gradient(135deg,rgba(6,182,212,.16),rgba(139,92,246,.16));border:1px solid rgba(6,182,212,.35);border-radius:18px;padding:1.1rem 1.2rem;margin-bottom:14px;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.gira-hero .big{font-size:2.4rem;font-weight:900;line-height:1;color:#a5f3fc;font-variant-numeric:tabular-nums}
.tg{border:1px solid var(--line2);background:transparent;border-radius:7px;padding:.25rem .45rem;font-size:.74rem;font-weight:800;color:var(--tx3)}
.tg.on{background:rgba(34,197,94,.2);border-color:var(--gr);color:var(--gr2)}
.va-SI{color:var(--gr2)}.va-NO{color:var(--rd2)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--tx3);font-size:10px;font-family:Figtree,sans-serif}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.75rem;color:var(--tx3);margin-top:.4rem}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:#16213a;border:1px solid rgba(6,182,212,.3);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:18px}}
.mbox h3{font-size:1.2rem;font-weight:900;color:#67e8f9;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.mbox h3 .sp{flex:1}
.fg{margin-bottom:.75rem}
.fg label{display:block;font-size:.8rem;font-weight:700;color:var(--tx2);margin-bottom:.3rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem}
.fgrid .full{grid-column:1/-1}
.mact{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.mact .btn{flex:1}
.x{background:none;border:none;font-size:1.4rem;color:var(--tx3);line-height:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:200;background:#0e7490;color:#ecfeff;padding:.65rem 1rem;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}.toast.err{background:#991b1b}
.empty{text-align:center;color:var(--tx3);padding:1.6rem .5rem;font-size:.9rem}
.loading{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:center}
.loading img{width:90px;height:90px;object-fit:contain;animation:pulse 1.4s infinite}
.timeline{display:flex;flex-wrap:wrap;gap:4px}
.timeline span{width:22px;height:22px;border-radius:5px;font-size:.62rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:#0b1222}
.cmt-i{padding:.5rem .6rem;border-radius:9px;background:rgba(255,255,255,.04);margin-bottom:5px;font-size:.86rem}
.cmt-i .h{font-size:.72rem;color:var(--tx3);margin-bottom:2px}
.up{color:var(--gr2)}.dn{color:var(--rd2)}

/* print */
#printArea{display:none}
@media print{
  html,body{background:#fff!important;color:#0f172a!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:10mm;font-family:Figtree,sans-serif}
  #printArea *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{margin:8mm}
}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px;border-bottom:3px solid #0e7490;padding-bottom:10px}
.ph img{width:60px;height:60px;object-fit:contain}
.ph .a{font-size:22px;font-weight:900;color:#0f172a}.ph .b{font-size:13px;font-weight:700;color:#0e7490}
.ph .c{margin-left:auto;text-align:right;font-size:12px;color:#334155;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pt{border:1.5px solid #0e7490;border-radius:10px;overflow:hidden;break-inside:avoid}
.pt h5{background:#0e7490;color:#fff;font-size:14px;padding:6px 10px;margin:0}
.pt .pc{font-size:11.5px;font-weight:700;color:#5b21b6;background:#ede9fe;padding:5px 10px}
.pt ol{margin:0;padding:6px 10px 8px 30px;font-size:12.5px}
.pt ol li{padding:2px 0;border-bottom:1px solid #e2e8f0}
.ptab{width:100%;border-collapse:collapse;font-size:11.5px}
.ptab th{background:#0e7490;color:#fff;padding:5px 6px;text-align:left;font-size:10.5px;position:static}
.ptab td{padding:4px 6px;border-bottom:1px solid #cbd5e1;color:#0f172a}
.ptab tr:nth-child(even) td{background:#f1f5f9}

/* ===== v2 ===== */
th.nos{cursor:default}
th .ar{color:var(--cy);font-size:.8em}
.login{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 50% 20%,rgba(6,182,212,.18),transparent 55%),linear-gradient(160deg,#0b1222,#132039)}
.login .box{width:100%;max-width:360px;text-align:center}
.login img{width:130px;height:130px;object-fit:contain;filter:drop-shadow(0 10px 30px rgba(6,182,212,.3))}
.login h1{font-size:1.8rem;font-weight:900;margin-top:12px;letter-spacing:-.02em}
.login .sub{color:var(--cy);font-weight:800;margin-bottom:26px}
.login input{text-align:center;font-size:1.6rem;letter-spacing:.5em;padding:.8rem;font-weight:800}
.login .btn{width:100%;margin-top:12px;padding:.9rem;font-size:1.05rem}
.login .err{color:var(--rd2);font-size:.88rem;margin-top:10px;min-height:1.2em}
.role{font-size:.66rem;font-weight:800;padding:.12rem .45rem;border-radius:999px;text-transform:uppercase;letter-spacing:.05em}
.role.admin{background:rgba(245,158,11,.18);color:var(--am2)}.role.staff{background:rgba(6,182,212,.15);color:#67e8f9}
.banner{background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:var(--rd2);border-radius:12px;padding:.55rem .75rem;margin:12px 0 0;font-size:.85rem;display:flex;gap:.6rem;align-items:center}
.tog{min-width:118px;height:40px;border-radius:10px;border:none;font-weight:800;font-size:.88rem;flex-shrink:0}
.tog.P{background:var(--gr);color:#04150a}.tog.A{background:var(--rd);color:#fff}
.motivos{display:flex;gap:5px;flex-wrap:wrap;margin-top:.45rem}
.motivos button{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:.25rem .65rem;font-size:.76rem;font-weight:700;color:var(--tx2)}
.motivos button.on{background:rgba(239,68,68,.22);border-color:var(--rd);color:#fff}
.files{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

</head>
<body>

<script>
/* =====================================================================
   Regatas Bella Vista · M9 Camada 2017 — App v2
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbw3STeF0y6gLe6DfeLqwrk57_quHXv33JFRWevNE9wp4Vy0VzF5lkT0pE6w7vnGLs7w/exec';

const TIPOS = { MIE: 'Miércoles', SAB: 'Sábado', PAR: 'Partido / Encuentro', OTR: 'Otro' };
const TIPOS_C = { MIE: 'Miércoles', SAB: 'Sábado', PAR: 'Partido', OTR: 'Otro' };
const MOTIVOS = ['Sin aviso', 'Avisó', 'Lesionado', 'Enfermo'];
const TABS = [['inicio', '🏠', 'Inicio'], ['asistencia', '✅', 'Asistencia'], ['equipos', '🧩', 'Equipos'], ['plantel', '👥', 'Plantel'], ['gira', '🚌', 'Gira'], ['stats', '📊', 'Estadísticas']];
const LS = { pin: 'm9_pin', cache: 'm9_cache_v2', pend: 'm9_pend_v2', tab: 'm9_tab', draft: 'm9_equipos_draft' };

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyISO = () => isoDate(new Date());
const parseISO = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fmtF = s => { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(s); };
const DIAS = ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'];
const fmtFC = s => { if (!s) return ''; const d = parseISO(s); return DIAS[d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const MESES_L = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const colorPct = p => p >= 80 ? 'var(--gr)' : p >= 60 ? 'var(--am)' : 'var(--rd)';
const horaAhora = () => new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false });
function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2800); }
function setSync(state, txt) { const s = $('sync'); s.className = 'sync ' + (state || ''); $('syncTxt').textContent = txt; }

/* =====================================================================
   CONEXIÓN CON LA PLANILLA (reintentos + caché + cola offline)
   ===================================================================== */
let DB = null, ROLE = 'staff', PEND = [], FLUSHING = false, ULTIMA_SYNC = '';
const isAdmin = () => ROLE === 'admin';
const pin = () => lsGet(LS.pin) || '';

async function llamar(params, body, intentos = 3) {
  let ultimo;
  for (let i = 0; i < intentos; i++) {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 35000);
    try {
      const url = API_URL + (params ? '?' + new URLSearchParams(Object.assign({ t: Date.now() }, params)) : '');
      const r = await fetch(url, body ? { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pin: pin() }, body)), signal: ctl.signal } : { signal: ctl.signal });
      clearTimeout(t);
      const txt = await r.text();
      let j; try { j = JSON.parse(txt); } catch (e) { throw new Error('Google respondió algo inesperado'); }
      if (!j.ok) { const e = new Error(j.error || 'Error'); e.fatal = true; throw e; }
      return j;
    } catch (e) {
      clearTimeout(t); ultimo = e;
      if (e.fatal) throw e;
      if (i < intentos - 1) await sleep(1200 * (i + 1));
    }
  }
  const e = new Error('Sin conexión con la planilla'); e.red = true; e.detalle = ultimo && ultimo.message; throw e;
}

function normalizar() {
  ['JUGADORES', 'ENTRENADORES', 'SESIONES', 'ASISTENCIA', 'EQUIPOS', 'GIRA'].forEach(k => DB[k] = DB[k] || []);
  DB.CONFIG = DB.CONFIG || {};
  DB.JUGADORES.forEach(j => {
    j.id = String(j.id); j.nivel = String(j.nivel || '').toUpperCase();
    j.nivel2 = j.nivel2 === '' || j.nivel2 == null ? null : Number(j.nivel2);
    j.activo = String(j.activo || 'SI').toUpperCase() === 'NO' ? 'NO' : 'SI';
    j.dni = j.dni == null ? '' : String(j.dni); j.fecha_nac = String(j.fecha_nac || '').slice(0, 10);
  });
  DB.ENTRENADORES.forEach(e => {
    e.id = String(e.id); e.hijo_id = e.hijo_id == null || e.hijo_id === '' ? '' : String(e.hijo_id);
    e.activo = String(e.activo || 'SI').toUpperCase() === 'NO' ? 'NO' : 'SI';
    e.asigna_equipos = String(e.asigna_equipos || 'SI').toUpperCase() === 'NO' ? 'NO' : 'SI';
    e.dni = e.dni == null ? '' : String(e.dni); e.fecha_nac = String(e.fecha_nac || '').slice(0, 10);
  });
  DB.SESIONES.forEach(s => {
    s.id = String(s.id); s.fecha = String(s.fecha).slice(0, 10); s.hora = String(s.hora || '').slice(0, 5);
    if (typeof s.archivos === 'string') { try { s.archivos = s.archivos ? JSON.parse(s.archivos) : []; } catch (e) { s.archivos = []; } }
    s.archivos = Array.isArray(s.archivos) ? s.archivos : [];
  });
  DB.ASISTENCIA.forEach(a => { a.sesion_id = String(a.sesion_id); a.persona_id = String(a.persona_id); a.fecha = String(a.fecha).slice(0, 10); a.calif = Number(a.calif || 0); a.motivo = a.motivo || ''; });
  DB.EQUIPOS.forEach(e => { e.grupo_id = String(e.grupo_id); e.persona_id = String(e.persona_id); });
  DB.GIRA.forEach(g => { g.persona_id = String(g.persona_id); g.clave = String(g.clave); });
}

function aplicarLocal(op) {
  if (op.sheet === 'CONFIG') { (op.rows || []).forEach(r => DB.CONFIG[r.clave] = r.valor); return; }
  const arr = DB[op.sheet];
  if (op.op === 'upsert') {
    op.rows.forEach(r => {
      const i = arr.findIndex(x => String(x[op.key]) === String(r[op.key]));
      if (i >= 0) arr[i] = Object.assign({}, arr[i], r); else arr.push(Object.assign({}, r));
    });
  } else {
    DB[op.sheet] = arr.filter(x => String(x[op.field]) !== String(op.value));
    if (op.op === 'replace') op.rows.forEach(r => DB[op.sheet].push(Object.assign({}, r)));
  }
}
function guardarCache() { lsSet(LS.cache, JSON.stringify({ pin: pin(), role: ROLE, ts: ULTIMA_SYNC, db: DB })); }
function guardarPend() { lsSet(LS.pend, JSON.stringify(PEND)); }

// guarda: aplica en pantalla al instante y sube a la planilla (si no hay señal, queda en cola)
async function guardar(ops, msgOk, demora) {
  ops.forEach(aplicarLocal); normalizar();
  ops.forEach(o => PEND.push(JSON.parse(JSON.stringify(o, (k, v) => k === 'archivos' && Array.isArray(v) ? JSON.stringify(v) : v))));
  guardarPend(); guardarCache();
  if (demora) { clearTimeout(guardar._t); setSync('busy', 'Pendiente…'); guardar._t = setTimeout(() => subirPendientes(), demora); return true; }
  const ok = await subirPendientes();
  if (msgOk) toast(ok ? msgOk : '📶 Sin señal: quedó guardado en el teléfono y se sube solo', !ok);
  return ok;
}
async function subirPendientes() {
  if (FLUSHING || !PEND.length) { if (!PEND.length) setSync('', ULTIMA_SYNC ? 'Al día ' + ULTIMA_SYNC : 'Al día'); return !PEND.length; }
  FLUSHING = true; setSync('busy', 'Guardando…');
  const lote = PEND.slice();
  try {
    await llamar(null, { action: 'ops', ops: lote });
    PEND = PEND.slice(lote.length); guardarPend();
    ULTIMA_SYNC = horaAhora(); guardarCache();
    setSync('', 'Guardado ' + ULTIMA_SYNC);
    return true;
  } catch (e) {
    if (e.fatal) { PEND = PEND.slice(lote.length); guardarPend(); toast('⚠️ ' + e.message, true); setSync('err', 'Error'); return false; }
    setSync('err', `${PEND.length} cambio(s) sin subir`);
    return false;
  } finally { FLUSHING = false; }
}
window.addEventListener('online', () => subirPendientes());
setInterval(() => { if (PEND.length) subirPendientes(); }, 45000);

async function refrescar(enSegundoPlano) {
  setSync('busy', 'Actualizando…');
  try {
    const j = await llamar({ action: 'all', pin: pin() });
    DB = j.data; ROLE = j.role || 'staff'; normalizar();
    PEND.forEach(op => { const o = JSON.parse(JSON.stringify(op)); if (o.rows) o.rows.forEach(r => { if (typeof r.archivos === 'string') { try { r.archivos = JSON.parse(r.archivos); } catch (e) {} } }); aplicarLocal(o); });
    normalizar();
    ULTIMA_SYNC = horaAhora(); guardarCache(); $('banner').classList.add('hidden');
    setSync('', 'Al día ' + ULTIMA_SYNC);
    subirPendientes();
    if (enSegundoPlano && !(AS && AS.sucio) && !$('modal').classList.contains('on')) { renderTop(); renderTab(); }
    return true;
  } catch (e) {
    if (!enSegundoPlano) throw e;
    if (e.fatal && /PIN/i.test(e.message)) { salir('El PIN cambió. Ingresalo de nuevo.'); return false; }
    setSync('err', 'Sin conexión');
    $('banner').innerHTML = `📶 No se pudo conectar con la planilla. Estás viendo los datos guardados ${ULTIMA_SYNC ? 'de las ' + ULTIMA_SYNC : 'en el teléfono'}. <button class="btn sm" onclick="refrescar(true)">Reintentar</button>`;
    $('banner').classList.remove('hidden');
    return false;
  }
}

/* ---------- ingreso con PIN ---------- */
function mostrarLogin(err) {
  $('loading').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('loginErr').textContent = err || '';
  $('pinIn').value = ''; setTimeout(() => $('pinIn').focus(), 80);
}
async function entrar() {
  const p = $('pinIn').value.trim(); if (!p) return;
  $('loginBtn').disabled = true; $('loginBtn').innerHTML = '<span class="spin"></span> Entrando…'; $('loginErr').textContent = '';
  lsSet(LS.pin, p);
  try {
    await refrescar(false);
    $('login').classList.add('hidden'); arrancarUI();
  } catch (e) {
    lsDel(LS.pin);
    $('loginErr').textContent = e.fatal ? (/PIN/i.test(e.message) ? 'PIN incorrecto' : e.message) : 'No hay conexión con la planilla. Probá de nuevo en unos segundos.';
  } finally { $('loginBtn').disabled = false; $('loginBtn').textContent = 'Entrar'; }
}
function salir(msg) {
  if (PEND.length && !msg && !confirm(`Hay ${PEND.length} cambio(s) sin subir a la planilla. Si salís se pierden. ¿Salir igual?`)) return;
  lsDel(LS.pin); lsDel(LS.cache); lsDel(LS.pend); PEND = []; DB = null;
  cerrarModal(); mostrarLogin(msg);
}
async function iniciar() {
  try { PEND = JSON.parse(lsGet(LS.pend) || '[]'); } catch (e) { PEND = []; }
  if (!pin()) return mostrarLogin();
  let cache = null; try { cache = JSON.parse(lsGet(LS.cache) || 'null'); } catch (e) {}
  if (cache && cache.pin === pin() && cache.db) {
    DB = cache.db; ROLE = cache.role; ULTIMA_SYNC = cache.ts || ''; normalizar();
    $('loading').classList.add('hidden'); arrancarUI();
    refrescar(true);
  } else {
    try { await refrescar(false); $('loading').classList.add('hidden'); arrancarUI(); }
    catch (e) { mostrarLogin(e.fatal ? e.message : 'No hay conexión con la planilla. Probá de nuevo.'); }
  }
}
function arrancarUI() { renderTop(); ir(lsGet(LS.tab) || 'inicio'); }
function renderTop() {
  $('roleTag').className = 'role ' + ROLE; $('roleTag').textContent = isAdmin() ? 'Admin' : 'Staff';
  document.querySelectorAll('img.escudo').forEach(i => { if (DB && DB.CONFIG.ESCUDO_URL && !i.dataset.ok) { i.dataset.ok = 1; i.src = DB.CONFIG.ESCUDO_URL; } });
}

/* =====================================================================
   HELPERS DE DOMINIO
   ===================================================================== */
const jugActivos = () => DB.JUGADORES.filter(j => j.activo !== 'NO').sort((a, b) => a.nombre.localeCompare(b.nombre));
const entActivos = () => DB.ENTRENADORES.filter(e => e.activo !== 'NO').sort((a, b) => entNom(a).localeCompare(entNom(b)));
const jugById = id => DB.JUGADORES.find(j => j.id === String(id));
const entById = id => DB.ENTRENADORES.find(e => e.id === String(id));
const entNom = e => e ? (e.apodo || e.nombre) : '';
const nivelTxt = j => !j.nivel ? 'S/C' : j.nivel === 'G' ? 'G' + (j.nivel2 ? ' ' + Number(j.nivel2).toFixed(1) : '') : j.nivel;
const nivelBadge = j => isAdmin() ? `<span class="lv lv-${esc(j.nivel || '2')}">${esc(nivelTxt(j))}</span>` : '';
const nivelNum = j => j.nivel === 'G' ? (j.nivel2 || 0) : (parseInt(j.nivel) || 2);
const giraDe = (t, id) => DB.GIRA.find(g => g.clave === t + '-' + id);
const viaja = (t, id) => { const g = giraDe(t, id); return !!g && String(g.va).toUpperCase() === 'SI'; };
const conAsistencia = () => new Set(DB.ASISTENCIA.map(a => a.sesion_id));
const sesionesOrd = () => [...DB.SESIONES].sort((a, b) => (b.fecha + b.tipo).localeCompare(a.fecha + a.tipo));
const tipoDeFecha = f => { const w = parseISO(f).getDay(); return w === 3 ? 'MIE' : w === 6 ? 'SAB' : 'OTR'; };
const nombreEntreno = s => `${fmtFC(s.fecha)} · ${TIPOS_C[s.tipo] || s.tipo}${s.hora ? ' ' + s.hora + ' h' : ''}`;
function proximoEntreno() { const d = new Date(); d.setHours(0, 0, 0, 0); for (let i = 0; i < 8; i++) { const w = d.getDay(); if (w === 3 || w === 6) return isoDate(d); d.setDate(d.getDate() + 1); } return hoyISO(); }

/* ---------- tablas ordenables (todas las columnas) ---------- */
const SORTS = {};
function tabla(id, cols, rows, def, rowAttr) {
  const s = SORTS[id] || (SORTS[id] = Object.assign({}, def));
  const col = cols.find(c => c.k === s.k);
  if (col) {
    const v = col.v || (r => r[col.k]);
    rows = [...rows].sort((a, b) => {
      const x = v(a), y = v(b);
      const vacio = z => z === null || z === undefined || z === '' || (typeof z === 'number' && isNaN(z));
      if (vacio(x) && vacio(y)) return 0; if (vacio(x)) return 1; if (vacio(y)) return -1;
      const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y), 'es', { numeric: true, sensitivity: 'base' });
      return s.desc ? -c : c;
    });
  }
  return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c => c.k ? `<th class="${c.num ? 'num' : ''}" onclick="ordenar('${id}','${c.k}',${c.num ? 1 : 0})">${c.t}${s.k === c.k ? `<span class="ar">${s.desc ? ' ↓' : ' ↑'}</span>` : ''}</th>` : `<th class="nos ${c.num ? 'num' : ''}">${c.t}</th>`).join('')}</tr></thead>

function calcStats(f) {
  f = f || {};
  const cA = conAsistencia();
  const ses = DB.SESIONES.filter(s => cA.has(s.id) && (!f.anio || s.fecha.slice(0, 4) === String(f.anio)) && (!f.mes || Number(s.fecha.slice(5, 7)) === Number(f.mes)) && (!f.tipo || s.tipo === f.tipo));
  const ids = new Set(ses.map(s => s.id));
  const recs = DB.ASISTENCIA.filter(a => ids.has(a.sesion_id)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const per = {};
  recs.forEach(a => {
    const k = a.persona_tipo + '-' + a.persona_id;
    const p = per[k] || (per[k] = { k, tipo: a.persona_tipo, id: a.persona_id, P: 0, A: 0, aviso: 0, MIE: [0, 0], SAB: [0, 0], PAR: [0, 0], OTR: [0, 0], up: 0, dn: 0, hist: [] });
    const pr = a.estado === 'P';
    pr ? p.P++ : p.A++;
    if (!pr && a.motivo && a.motivo !== 'Sin aviso') p.aviso++;
    if (p[a.tipo]) { p[a.tipo][1]++; if (pr) p[a.tipo][0]++; }
    if (a.calif > 0) p.up++; if (a.calif < 0) p.dn++;
    p.hist.push(a);
  });
  Object.values(per).forEach(p => {
    p.tot = p.P + p.A; p.pct = pct(p.P, p.tot);
    const h = p.hist; let n = 0; const last = h.length ? h[h.length - 1].estado : null;
    for (let i = h.length - 1; i >= 0 && h[i].estado === last; i--) n++;
    p.racha = last ? { e: last, n } : null;
  });
  const porSesion = ses.map(s => {
    const r = recs.filter(a => a.sesion_id === s.id);
    return { s, jp: r.filter(a => a.persona_tipo === 'J' && a.estado === 'P').length, jt: r.filter(a => a.persona_tipo === 'J').length, ep: r.filter(a => a.persona_tipo === 'E' && a.estado === 'P').length, et: r.filter(a => a.persona_tipo === 'E').length };
  }).sort((a, b) => a.s.fecha.localeCompare(b.s.fecha));
  return { ses, recs, per, porSesion };
}
const vacioStat = () => ({ P: 0, A: 0, aviso: 0, tot: 0, pct: 0, MIE: [0, 0], SAB: [0, 0], PAR: [0, 0], up: 0, dn: 0, hist: [], racha: null });
function alertas() {
  const out = []; const st = calcStats({ anio: new Date().getFullYear() });
  jugActivos().forEach(j => {
    const p = st.per['J-' + j.id]; if (!p) return;
    if (p.racha && p.racha.e === 'A' && p.racha.n >= 3) out.push({ t: 'rd', j, txt: `${p.racha.n} faltas seguidas` });
    else { const u = p.hist.slice(-8), pr = u.filter(a => a.estado === 'P').length; if (u.length >= 6 && pr / u.length < .5) out.push({ t: 'am', j, txt: `vino ${pr} de los últimos ${u.length}` }); }
  });
  return out;
}
function cumpleanos() {
  const hoy = new Date(), m = hoy.getMonth() + 1;

// MISMA función que en Code.gs (el servidor la usa para el staff, que no ve niveles)
function armarEquipos(J, E, presJ, presE, modo, n) {
  var pj = {}; presJ.forEach(function (x) { pj[String(x)] = 1; });
  var pe = {}; presE.forEach(function (x) { pe[String(x)] = 1; });
  var pres = J.filter(function (j) { return pj[j.id]; });
  if (!pres.length) return [];
  var shuffle = function (a) { for (var i = a.length - 1; i > 0; i--) { var k = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[k]; a[k] = t; } return a; };
  var ord = { G: 0, '1': 1, '2': 2, '3': 3 };
  var porNivel = function (arr) {
    var g = {};
    arr.forEach(function (j) { var k = j.nivel === 'G' ? 'G' + (j.nivel2 || 9) : (j.nivel || '2'); (g[k] = g[k] || []).push(j); });
    return Object.keys(g).sort(function (a, b) { return ((ord[a[0]] || 2) - (ord[b[0]] || 2)) || (a < b ? -1 : a > b ? 1 : 0); })
      .reduce(function (acc, k) { return acc.concat(shuffle(g[k])); }, []);
  };
  var snake = function (lista, eqs) { var i = 0, dir = 1; lista.forEach(function (j) { eqs[i].jugadores.push(j); i += dir; if (i === eqs.length) { i = eqs.length - 1; dir = -1; } else if (i < 0) { i = 0; dir = 1; } }); };
  var equipos = [], i;
  var hayG = pres.some(function (j) { return j.nivel === 'G'; });
  if (modo === 'por-nivel' && hayG) {
    n = Math.max(n, 3);
    equipos.push({ id: 1, nombre: 'Gloriosa A', jugadores: [], entrenadores: [] }, { id: 2, nombre: 'Gloriosa B', jugadores: [], entrenadores: [] });
    snake(porNivel(pres.filter(function (j) { return j.nivel === 'G'; })), equipos.slice(0, 2));
    var resto = [];
    for (i = 0; i < n - 2; i++) resto.push({ id: i + 3, nombre: 'Equipo ' + (i + 3), jugadores: [], entrenadores: [] });
    snake(porNivel(pres.filter(function (j) { return j.nivel !== 'G'; })), resto);
    equipos = equipos.concat(resto);
  } else {
    for (i = 0; i < n; i++) equipos.push({ id: i + 1, nombre: 'Equipo ' + (i + 1), jugadores: [], entrenadores: [] });
    snake(porNivel(pres), equipos);
  }
  var ents = shuffle(E.filter(function (e) { return e.asigna_equipos !== 'NO' && pe[e.id]; }));
  var sinHijo = [];
  ents.forEach(function (e) {
    var eq = null;
    if (e.hijo_id) equipos.forEach(function (q) { if (!eq && q.jugadores.some(function (j) { return j.id === e.hijo_id; })) eq = q; });
    if (eq && eq.entrenadores.length < 2) eq.entrenadores.push(e.id); else sinHijo.push(e);
  });
  sinHijo.forEach(function (e) { var eq = equipos.slice().sort(function (a, b) { return a.entrenadores.length - b.entrenadores.length; })[0]; eq.entrenadores.push(e.id); });
  equipos.forEach(function (e) { e.jugadores = e.jugadores.map(function (j) { return j.id; }); });
  return equipos;
}
async function generarEQ() {
  const presJ = [...EQ.presentesJ].filter(id => (jugById(id) || {}).activo !== 'NO'), presE = [...EQ.presentesE];
  if (isAdmin()) { EQ.equipos = armarEquipos(jugActivos(), entActivos(), presJ, presE, EQ.modo, EQ.n); EQ.sel = null; guardarBorradorEQ(); return; }
  EQ.cargando = true; if (TAB === 'equipos') renderEquipos();

  catch (e) { toast('⚠️ Para mezclar equipos hace falta conexión', true); }

}

function promEQ(eq) { const js = eq.jugadores.map(jugById).filter(Boolean); return js.length ? js.reduce((s, j) => s + nivelNum(j), 0) / js.length : 0; }
function renderEquipos() {

  const Ep = Object.values(S.per).filter(p => p.tipo === 'E'), promE = Ep.length ? Math.round(Ep.reduce((s, p) => s + p.pct, 0) / Ep.length) : null;
  const up = S.recs.filter(a => a.calif > 0).length, dn = S.recs.filter(a => a.calif < 0).length;
  const filas = (ST.vista === 'J' ? DB.JUGADORES : DB.ENTRENADORES).map(x => ({ x, p: S.per[ST.vista + '-' + x.id] || vacioStat(), nombre: ST.vista === 'J' ? x.nombre : entNom(x) })).filter(r => r.p.tot > 0 || r.x.activo !== 'NO');
  const dest = S.recs.filter(a => (a.calif !== 0 || a.comentario) && (ST.dest === 'todos' || (ST.dest === 'up' && a.calif > 0) || (ST.dest === 'dn' && a.calif < 0) || (ST.dest === 'cm' && a.comentario))).sort((a, b) => b.fecha.localeCompare(a.fecha));

  Object.values(S.per).filter(p => p.tipo === 'J').forEach(p => { const j = jugById(p.id); if (!j) return; const c = j.colegio || 'N/A'; col[c] = col[c] || { P: 0, T: 0, n: 0 }; col[c].P += p.P; col[c].T += p.tot; col[c].n++; });
  const cols = Object.entries(col).map(([c, v]) => ({ c, pc: pct(v.P, v.T), n: v.n })).sort((a, b) => b.pc - a.pc);
  const mot = {}; S.recs.filter(a => a.persona_tipo === 'J' && a.estado === 'A').forEach(a => { const m = a.motivo || 'Sin aviso'; mot[m] = (mot[m] || 0) + 1; });
  const totAus = Object.values(mot).reduce((a, b) => a + b, 0);
  const mes = {}; S.recs.filter(a => a.persona_tipo === 'J').forEach(a => { const m = a.fecha.slice(0, 7); mes[m] = mes[m] || [0, 0]; mes[m][1]++; if (a.estado === 'P') mes[m][0]++; });
  const meses = Object.keys(mes).sort();
  const pctT = (p, t) => p[t][1] ? pct(...p[t]) : null;
  $('v-stats').innerHTML = `
  <h2 class="sec">📊 Estadísticas <span class="sp"></span><button class="btn sm" onclick="exportarCSV()">⬇️ Exportar CSV</button></h2>
  <div class="row" style="margin-bottom:12px">
    <select style="max-width:110px" onchange="ST.anio=this.value;renderStats()">${(anios.length ? anios : [ST.anio]).map(a => `<option ${a === ST.anio ? 'selected' : ''}>${a}</option>`).join('')}</select>
    <select style="max-width:150px" onchange="ST.mes=this.value;renderStats()"><option value="">Todo el año</option>${MESES.map((m, i) => `<option value="${i + 1}" ${String(ST.mes) === String(i + 1) ? 'selected' : ''}>${m}</option>`).join('')}</select>
    <div class="seg">${[['', 'Todos'], ['MIE', 'Miércoles'], ['SAB', 'Sábados'], ['PAR', 'Partidos']].map(([k, t]) => `<button class="${ST.tipo === k ? 'on' : ''}" onclick="ST.tipo='${k}';renderStats()">${t}</button>`).join('')}</div>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="l">Entrenamientos</div><div class="v">${S.ses.length}</div><div class="s">${S.ses.filter(s => s.tipo === 'MIE').length} mié · ${S.ses.filter(s => s.tipo === 'SAB').length} sáb · ${S.ses.filter(s => s.tipo === 'PAR').length} part.</div></div>
    <div class="kpi"><div class="l">Asistencia jugadores</div><div class="v" style="color:${promJ == null ? 'var(--tx3)' : colorPct(promJ)}">${promJ == null ? '—' : promJ + '%'}</div><div class="s">${promPres} presentes por entrenamiento</div></div>
    <div class="kpi"><div class="l">Asistencia entrenadores</div><div class="v" style="color:${promE == null ? 'var(--tx3)' : colorPct(promE)}">${promE == null ? '—' : promE + '%'}</div><div class="s">promedio del staff</div></div>
    <div class="kpi"><div class="l">Destacados</div><div class="v"><span class="up">▲${up}</span> <span class="dn">▼${dn}</span></div><div class="s">marcas del período</div></div>
  </div>
  <div class="grid g2">
    <div class="card chart"><h3>👦 Presentes por entrenamiento</h3>${chartSesiones(pj)}<div class="legend"><span><i style="background:#06b6d4"></i>Miércoles</span><span><i style="background:#8b5cf6"></i>Sábado</span><span><i style="background:#f59e0b"></i>Partido</span><span><i style="background:#94a3b8"></i>Otro</span></div></div>
    <div class="card chart"><h3>📅 % asistencia por mes</h3>${chartMeses(meses, mes)}</div>
  </div>
  <div class="card">
    <h3>🏅 Ranking de asistencia <span class="sp"></span><div class="seg"><button class="${ST.vista === 'J' ? 'on' : ''}" onclick="ST.vista='J';renderStats()">Jugadores</button><button class="${ST.vista === 'E' ? 'on' : ''}" onclick="ST.vista='E';renderStats()">Entrenadores</button></div></h3>
    <div class="small muted" style="margin-bottom:6px">Tocá cualquier título para ordenar de mayor a menor o al revés.</div>
    ${tabla('st' + ST.vista, [
      { t: '#', h: (r, i) => `<span class="muted">${i + 1}</span>` },
      { k: 'nombre', t: 'Nombre', h: r => `<b>${esc(r.nombre)}</b>${r.x.activo === 'NO' ? ' <span class="pill" style="background:rgba(148,163,184,.2)">baja</span>' : ''}` },
      ...(ST.vista === 'J' ? (adm ? [{ k: 'nivel', t: 'Nivel', v: r => r.x.nivel === 'G' ? (r.x.nivel2 || 0) / 10 : nivelNum(r.x), h: r => nivelBadge(r.x) }] : []) : [{ k: 'rol', t: 'Rol', v: r => r.x.rol, h: r => esc(r.x.rol || '') }]),
      { k: 'P', t: 'Pres.', num: 1, v: r => r.p.P, h: r => r.p.P },
      { k: 'A', t: 'Aus.', num: 1, v: r => r.p.A, h: r => r.p.A },
      { k: 'aviso', t: 'Avisó', num: 1, v: r => r.p.aviso, h: r => r.p.aviso || '' },
      { k: 'pct', t: '%', num: 1, v: r => r.p.tot ? r.p.pct : null, h: r => `<b style="color:${r.p.tot ? colorPct(r.p.pct) : 'var(--tx4)'}">${r.p.tot ? r.p.pct + '%' : '—'}</b>` },
      { t: '', h: r => `<div class="bar"><i style="width:${r.p.pct}%;background:${colorPct(r.p.pct)}"></i></div>` },
      { k: 'MIE', t: '% Mié', num: 1, v: r => pctT(r.p, 'MIE'), h: r => pctT(r.p, 'MIE') == null ? '—' : pctT(r.p, 'MIE') + '%' },
      { k: 'SAB', t: '% Sáb', num: 1, v: r => pctT(r.p, 'SAB'), h: r => pctT(r.p, 'SAB') == null ? '—' : pctT(r.p, 'SAB') + '%' },
      { k: 'up', t: '▲', num: 1, v: r => r.p.up, h: r => `<span class="up">${r.p.up || ''}</span>` },
      { k: 'dn', t: '▼', num: 1, v: r => r.p.dn, h: r => `<span class="dn">${r.p.dn || ''}</span>` },
      { k: 'racha', t: 'Racha', num: 1, v: r => r.p.racha ? (r.p.racha.e === 'P' ? r.p.racha.n : -r.p.racha.n) : null, h: r => r.p.racha ? `<span class="pill" style="background:${r.p.racha.e === 'P' ? 'rgba(34,197,94,.18);color:var(--gr2)' : 'rgba(239,68,68,.18);color:var(--rd2)'}">${r.p.racha.n} ${r.p.racha.e === 'P' ? 'pres.' : 'aus.'}</span>` : '' },
      { t: 'Últimos 10', h: r => `<span class="dots">${r.p.hist.slice(-10).map(a => `<i class="d${a.estado}" title="${fmtF(a.fecha)}"></i>`).join('')}</span>` }
    ], filas, { k: 'pct', desc: true }, r => `class="clk" onclick="${ST.vista === 'J' ? 'fichaJugador' : 'fichaEntrenador'}('${r.x.id}')"`)}
  </div>
  <div class="grid g3">
    <div class="card"><h3>⭐ Destacados y comentarios <span class="sp"></span><select style="width:auto" onchange="ST.dest=this.value;renderStats()">${[['todos', 'Todos'], ['up', '▲ Positivos'], ['dn', '▼ A mejorar'], ['cm', '💬 Con comentario']].map(([k, t]) => `<option value="${k}" ${ST.dest === k ? 'selected' : ''}>${t}</option>`).join('')}</select></h3>
      <div style="max-height:420px;overflow-y:auto">${dest.length ? dest.map(a => `<div class="cmt-i clk" onclick="${a.persona_tipo === 'J' ? 'fichaJugador' : 'fichaEntrenador'}('${a.persona_id}')"><div class="h">${fmtFC(a.fecha)} · ${TIPOS_C[a.tipo] || a.tipo}</div>${a.calif > 0 ? '<b class="up">▲</b> ' : a.calif < 0 ? '<b class="dn">▼</b> ' : '💬 '}<b>${esc(a.nombre)}</b>${a.comentario ? ' — ' + esc(a.comentario) : ''}</div>`).join('') : '<div class="empty">Sin marcas en el período.</div>'}</div>
    </div>
    <div class="card"><h3>🚫 Motivos de ausencia</h3>
      ${totAus ? Object.entries(mot).sort((a, b) => b[1] - a[1]).map(([m, n]) => `<div class="list-i"><span class="grow">${esc(m)}</span><div class="bar" style="width:110px"><i style="width:${pct(n, totAus)}%;background:${m === 'Sin aviso' ? 'var(--rd)' : 'var(--am)'}"></i></div><b style="width:60px;text-align:right">${n} <span class="muted small">${pct(n, totAus)}%</span></b></div>`).join('') : '<div class="empty">Sin ausencias en el período.</div>'}
    </div>
    <div class="card"><h3>🏫 Asistencia por colegio</h3>
      ${cols.length ? cols.map(c => `<div class="list-i"><span class="grow">${esc(c.c)} <span class="muted small">(${c.n})</span></span><div class="bar" style="width:110px"><i style="width:${c.pc}%;background:${colorPct(c.pc)}"></i></div><b style="width:44px;text-align:right">${c.pc}%</b></div>`).join('') : '<div class="empty">Sin datos.</div>'}
    </div>
  </div>`;
}
function chartSesiones(pj) {
  if (!pj.length) return '<div class="empty">Sin entrenamientos en el período.</div>';
  const W = 600, H = 200, pl = 28, pb = 22, max = Math.max(...pj.map(x => x.jt), 1), bw = (W - pl) / pj.length, col = { MIE: '#06b6d4', SAB: '#8b5cf6', PAR: '#f59e0b', OTR: '#94a3b8' };
  const y = v => H - pb - (v / max) * (H - pb - 10);
  let g = '';
  [0, .5, 1].forEach(t => { const v = Math.round(max * t); g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${pl - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
  pj.forEach((x, i) => {
    const bx = pl + i * bw + bw * .15, w = Math.max(bw * .7, 2);
    g += `<rect x="${bx}" y="${y(x.jt)}" width="${w}" height="${H - pb - y(x.jt)}" rx="2" fill="rgba(255,255,255,.06)"/><rect class="clk" onclick="irAsistencia('${x.s.fecha}','${x.s.tipo}')" x="${bx}" y="${y(x.jp)}" width="${w}" height="${H - pb - y(x.jp)}" rx="2" fill="${col[x.s.tipo] || '#94a3b8'}"><title>${fmtFC(x.s.fecha)}: ${x.jp}/${x.jt} (${pct(x.jp, x.jt)}%)</title></rect>`;
    if (pj.length <= 16 || i % Math.ceil(pj.length / 12) === 0) g += `<text x="${bx + w / 2}" y="${H - 6}" text-anchor="middle">${x.s.fecha.slice(8, 10)}/${x.s.fecha.slice(5, 7)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Presentes por entrenamiento">${g}</svg>`;
}
function chartMeses(meses, mes) {
  if (!meses.length) return '<div class="empty">Sin datos.</div>';
  const W = 600, H = 200, pb = 22, bw = W / meses.length, y80 = H - pb - (H - pb - 14) * .8;
  let g = `<line x1="0" x2="${W}" y1="${y80}" y2="${y80}" stroke="rgba(34,197,94,.35)" stroke-dasharray="4 4"/><text x="${W - 2}" y="${y80 - 4}" text-anchor="end">80%</text>`;
  meses.forEach((m, i) => { const p = pct(...mes[m]), h = (H - pb - 14) * p / 100, bx = i * bw + bw * .2, w = bw * .6; g += `<rect x="${bx}" y="${H - pb - h}" width="${w}" height="${h}" rx="4" fill="${p >= 80 ? '#22c55e' : p >= 60 ? '#f59e0b' : '#ef4444'}"/><text x="${bx + w / 2}" y="${H - pb - h - 4}" text-anchor="middle" style="fill:#f1f5f9;font-weight:700">${p}%</text><text x="${bx + w / 2}" y="${H - 6}" text-anchor="middle">${MESES[Number(m.slice(5, 7)) - 1]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Asistencia por mes">${g}</svg>`;
}
function fichaPersona(t, id) {
  const x = t === 'J' ? jugById(id) : entById(id); if (!x) return;
  const anio = new Date().getFullYear(), p = calcStats({ anio }).per[t + '-' + id] || vacioStat();
  const coms = p.hist.filter(a => a.calif !== 0 || a.comentario).reverse();
  const hijo = t === 'E' && jugById(x.hijo_id), padres = t === 'J' ? DB.ENTRENADORES.filter(e => e.hijo_id === id) : [];
  abrirModal(`<h3>${t === 'J' ? '👦' : '🧢'} ${esc(t === 'J' ? x.nombre : entNom(x))}<span class="sp"></span><button class="x" onclick="cerrarModal()">×</button></h3>
  <div class="row small muted" style="margin:-6px 0 12px">${t === 'J' ? `${nivelBadge(x)} ${esc(x.colegio)} · ${esc(x.grado)}${padres.length ? ' · 🧢 ' + padres.map(entNom).map(esc).join(', ') : ''}` : `${esc(x.rol || '')}${hijo ? ' · hijo: ' + esc(hijo.nombre) : ''}`} ${viaja(t, id) ? '· ✈️ viaja a la gira' : ''} ${x.activo === 'NO' ? '· <b>baja ' + fmtF(x.fecha_baja) + '</b>' : ''}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">Asistencia ${anio}</div><div class="v" style="color:${colorPct(p.pct)}">${p.tot ? p.pct + '%' : '—'}</div><div class="s">${p.P} de ${p.tot}${p.aviso ? ' · avisó ' + p.aviso : ''}</div></div>
    <div class="kpi"><div class="l">Mié / Sáb</div><div class="v" style="font-size:1.2rem">${p.MIE[1] ? pct(...p.MIE) + '%' : '—'} / ${p.SAB[1] ? pct(...p.SAB) + '%' : '—'}</div></div>
    <div class="kpi"><div class="l">Marcas</div><div class="v" style="font-size:1.3rem"><span class="up">▲${p.up}</span> <span class="dn">▼${p.dn}</span></div></div>
  </div>
  <div class="card"><h3>🗓️ Entrenamiento por entrenamiento</h3><div class="timeline">${p.hist.map(a => `<span style="background:${a.estado === 'P' ? 'var(--gr)' : a.motivo && a.motivo !== 'Sin aviso' ? 'var(--am)' : 'var(--rd)'}" title="${fmtFC(a.fecha)} ${TIPOS_C[a.tipo] || ''}${a.motivo ? ' · ' + esc(a.motivo) : ''}${a.comentario ? ': ' + esc(a.comentario) : ''}">${a.calif > 0 ? '▲' : a.calif < 0 ? '▼' : a.fecha.slice(8, 10)}</span>`).join('') || '<span class="muted small" style="width:auto;color:var(--tx3)">Sin registros</span>'}</div><div class="legend"><span><i style="background:var(--gr)"></i>Presente</span><span><i style="background:var(--am)"></i>Ausente con aviso</span><span><i style="background:var(--rd)"></i>Ausente sin aviso</span></div></div>
  <div class="card"><h3>⭐ Destacados y comentarios</h3>${coms.length ? coms.map(a => `<div class="cmt-i"><div class="h">${fmtFC(a.fecha)} · ${TIPOS_C[a.tipo] || ''}</div>${a.calif > 0 ? '<b class="up">▲</b> ' : a.calif < 0 ? '<b class="dn">▼</b> ' : '💬 '}${esc(a.comentario || '(sin comentario)')}</div>`).join('') : '<div class="empty">Nada marcado todavía.</div>'}</div>
  ${x.observaciones ? `<div class="info">📝 ${esc(x.observaciones)}</div>` : ''}
  <div class="mact"><button class="btn" onclick="cerrarModal();${t === 'J' ? `editarJugador('${id}')` : `editarEntrenador('${id}')`}">✏️ Editar datos</button></div>`);
}
const fichaJugador = id => fichaPersona('J', id), fichaEntrenador = id => fichaPersona('E', id);
function exportarCSV() {
  const adm = isAdmin(), S = calcStats({ anio: ST.anio, mes: ST.mes, tipo: ST.tipo });
  const rows = [['tipo', 'id', 'nombre', ...(adm ? ['nivel'] : []), 'colegio_o_rol', 'presentes', 'ausentes', 'ausencias_con_aviso', 'pct', 'pct_mie', 'pct_sab', 'positivos', 'a_mejorar', 'activo', 'viaja_gira']];
  const fila = (tipo, x, nom, extra, k) => { const p = S.per[k] || vacioStat(); return [tipo, x.id, nom, ...(adm ? [tipo === 'Jugador' ? nivelTxt(x) : ''] : []), extra, p.P, p.A, p.aviso, p.pct, p.MIE[1] ? pct(...p.MIE) : '', p.SAB[1] ? pct(...p.SAB) : '', p.up, p.dn, x.activo, viaja(k[0], x.id) ? 'SI' : 'NO']; };
  DB.JUGADORES.forEach(j => rows.push(fila('Jugador', j, j.nombre, j.colegio, 'J-' + j.id)));
  DB.ENTRENADORES.forEach(e => rows.push(fila('Entrenador', e, entNom(e), e.rol, 'E-' + e.id)));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `M9_estadisticas_${ST.anio}${ST.mes ? '_' + pad(ST.mes) : ''}.csv`; a.click();
}

/* =====================================================================
   AJUSTES
   ===================================================================== */
function abrirAjustes() {
  abrirModal(`<h3>⚙️ Ajustes<span class="sp"></span><button class="x" onclick="cerrarModal()">×</button></h3>
  <div class="list-i"><span class="grow">Perfil</span><span class="role ${ROLE}">${isAdmin() ? 'Administrador' : 'Staff'}</span></div>
  <div class="list-i"><span class="grow">Última sincronización</span><b>${ULTIMA_SYNC || '—'}</b></div>
  <div class="list-i"><span class="grow">Cambios pendientes de subir</span><b style="color:${PEND.length ? 'var(--am2)' : 'var(--gr2)'}">${PEND.length}</b></div>
  <div class="mact"><button class="btn pri" onclick="cerrarModal();refrescar(true).then(ok=>toast(ok?'🔄 Datos actualizados':'📶 Sin conexión',!ok))">🔄 Actualizar datos</button>${PEND.length ? `<button class="btn" onclick="cerrarModal();subirPendientes().then(ok=>toast(ok?'✅ Cambios subidos':'📶 Todavía sin conexión',!ok))">⬆️ Subir pendientes</button>` : ''}</div>
  <div class="mact"><button class="btn red" onclick="salir()">🔒 Cerrar sesión</button></div>
  <p class="small muted" style="margin-top:12px">${isAdmin() ? 'Como administrador ves y editás las calificaciones (niveles) de los jugadores.' : 'Con el PIN de staff no se ven las calificaciones de los jugadores.'}</p>`);
}
window.addEventListener('beforeunload', e => { if ((AS && AS.sucio) || PEND.length) { e.preventDefault(); e.returnValue = ''; } });
$('pinIn').addEventListener('keydown', e => { if (e.key === 'Enter') entrar(); });
iniciar();

</script>
