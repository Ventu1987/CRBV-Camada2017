<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Regatas M9 · Camada 2017</title>
<link rel="icon" href="escudo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1222; --bg2:#111b30; --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.18);
  --tx:#f1f5f9; --tx2:#cbd5e1; --tx3:#94a3b8; --tx4:#64748b;
  --cy:#06b6d4; --cy2:#0891b2; --vi:#8b5cf6; --vi2:#c4b5fd; --gr:#22c55e; --gr2:#86efac; --rd:#ef4444; --rd2:#fca5a5; --am:#f59e0b; --am2:#fcd34d;
  --r:14px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{font-family:'Figtree',system-ui,sans-serif;background:linear-gradient(160deg,#0b1222 0%,#132039 60%,#0f172a 100%) fixed;background-color:var(--bg);color:var(--tx);min-height:100vh;font-size:15px;line-height:1.4;padding-bottom:84px}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx);background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;padding:.6rem .7rem;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cy);background:rgba(6,182,212,.08)}
select option{background:#1e293b}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.hidden{display:none!important}
.muted{color:var(--tx3)} .small{font-size:.8rem} .tiny{font-size:.72rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.85rem .9rem}
.kpi .l{font-size:.75rem;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:1.7rem;font-weight:800;margin-top:.15rem;font-variant-numeric:tabular-nums}
.kpi .s{font-size:.75rem;color:var(--tx3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:12px}
.card h3{font-size:1rem;font-weight:800;margin-bottom:.7rem;display:flex;align-items:center;gap:.45rem}
.card h3 .sp{flex:1}
h2.sec{font-size:1.35rem;font-weight:900;margin:18px 0 12px;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
h2.sec .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.6rem .9rem;border-radius:10px;border:1px solid var(--line2);background:transparent;font-weight:700;font-size:.9rem;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.pri{background:linear-gradient(135deg,var(--cy),var(--cy2));border:none;color:#04131a}
.btn.vio{background:linear-gradient(135deg,var(--vi),#7c3aed);border:none}
.btn.grn{background:linear-gradient(135deg,var(--gr),#16a34a);border:none;color:#04150a}
.btn.red{border-color:rgba(239,68,68,.5);color:var(--rd2)}
.btn.sm{padding:.4rem .6rem;font-size:.8rem;border-radius:8px}
.btn.on{border:2px solid var(--cy);background:rgba(6,182,212,.12)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.seg button{background:transparent;border:none;padding:.5rem .8rem;font-weight:700;font-size:.85rem;color:var(--tx2)}
.seg button.on{background:rgba(6,182,212,.18);color:#a5f3fc}
.pill{display:inline-flex;align-items:center;gap:.25rem;padding:.12rem .5rem;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.lv{padding:.15rem .5rem;border-radius:6px;font-size:.72rem;font-weight:800;white-space:nowrap}
.lv-G{background:rgba(168,85,247,.22);color:#d8b4fe}.lv-1{background:rgba(34,197,94,.2);color:#86efac}.lv-2{background:rgba(59,130,246,.2);color:#93c5fd}.lv-3{background:rgba(239,68,68,.2);color:#fca5a5}
.t-MIE{background:rgba(6,182,212,.18);color:#67e8f9}.t-SAB{background:rgba(139,92,246,.22);color:#ddd6fe}.t-PAR{background:rgba(245,158,11,.2);color:#fcd34d}.t-OTR{background:rgba(148,163,184,.2);color:#cbd5e1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th,td{padding:.5rem .55rem;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);background:rgba(255,255,255,.03);position:sticky;top:0;cursor:pointer;user-select:none}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(255,255,255,.03)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.clk{cursor:pointer}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden;min-width:60px}
.bar>i{display:block;height:100%;border-radius:3px}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;display:inline-block}
.dP{background:var(--gr)}.dA{background:var(--rd)}.dN{background:rgba(255,255,255,.12)}

/* header */
.top{position:sticky;top:0;z-index:50;background:rgba(11,18,34,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:.7rem;height:56px}
.top img{width:34px;height:34px;object-fit:contain}
.top .t1{font-weight:900;font-size:1rem;line-height:1.1}
.top .t2{font-size:.72rem;color:var(--cy);font-weight:700}
.sync{font-size:.72rem;color:var(--tx3);display:flex;align-items:center;gap:.3rem}
.top .t1,.top .t2{white-space:nowrap}
@media(max-width:420px){#syncTxt{display:none}}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--gr);display:inline-block}
.sync.busy i{background:var(--am);animation:pulse 1s infinite}.sync.err i{background:var(--rd)}
@keyframes pulse{50%{opacity:.3}}
.tabs-top{display:none;gap:4px;margin-left:auto}
.tabs-top button{background:transparent;border:none;padding:.5rem .75rem;border-radius:8px;font-weight:700;color:var(--tx2);font-size:.9rem}
.tabs-top button.on{background:rgba(6,182,212,.15);color:#a5f3fc}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;background:rgba(11,18,34,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
.nav button{background:none;border:none;padding:.5rem 0 .55rem;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.66rem;font-weight:700;color:var(--tx3)}
.nav button span{font-size:1.25rem;line-height:1}
.nav button.on{color:#67e8f9}
@media(min-width:900px){.tabs-top{display:flex}.nav{display:none}body{padding-bottom:30px}}

/* hero */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 0 18px}
.hero img{width:120px;height:120px;object-fit:contain;filter:drop-shadow(0 8px 24px rgba(6,182,212,.25))}
.hero h1{font-size:clamp(1.7rem,6vw,2.6rem);font-weight:900;margin-top:10px;letter-spacing:-.02em}
.hero .sub{font-size:clamp(1rem,3.5vw,1.25rem);font-weight:800;color:var(--cy);margin-top:2px}
.hero .chips{display:flex;gap:.4rem;margin-top:10px;flex-wrap:wrap;justify-content:center}
.hero .chips span{padding:.3rem .75rem;border-radius:999px;border:1px solid var(--line2);font-size:.8rem;font-weight:700;color:var(--tx2)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem;text-align:left;font-weight:800;font-size:.95rem}
.qa button small{display:block;color:var(--tx3);font-weight:500;font-size:.75rem;margin-top:2px}
.qa button:hover{border-color:var(--cy)}
.alert{display:flex;gap:.6rem;align-items:center;padding:.55rem .7rem;border-radius:10px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);margin-bottom:6px;font-size:.88rem}
.alert.am{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.25)}
.list-i{display:flex;align-items:center;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.list-i:last-child{border-bottom:none}

/* asistencia */
.att-head{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.att-head .full{grid-column:1/-1}
@media(min-width:700px){.att-head{grid-template-columns:160px 170px 1fr}.att-head .full{grid-column:auto}}
.att-tools{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin:10px 0}
.att-list{display:flex;flex-direction:column;gap:6px}
.att{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.55rem .6rem}
.att.P{border-color:rgba(34,197,94,.45);background:rgba(34,197,94,.06)}
.att.A{border-color:rgba(239,68,68,.45);background:rgba(239,68,68,.06)}
.att .main{display:flex;align-items:center;gap:.5rem}
.att .nm{flex:1;min-width:0}
.att .nm b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att .nm small{color:var(--tx4);font-size:.72rem}
.sb{width:40px;height:38px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-weight:900;font-size:1rem;flex-shrink:0}
.sb.p.on{background:var(--gr);border-color:var(--gr);color:#04150a}
.sb.a.on{background:var(--rd);border-color:var(--rd);color:#fff}
.cb{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:transparent;font-size:.95rem;flex-shrink:0;color:var(--tx3)}
.cb.up.on{background:rgba(34,197,94,.25);border-color:var(--gr);color:var(--gr2)}
.cb.dn.on{background:rgba(239,68,68,.25);border-color:var(--rd);color:var(--rd2)}
.cb.cm.on{background:rgba(245,158,11,.2);border-color:var(--am);color:var(--am2)}
.att .cmt{margin-top:.45rem}
.stick{position:sticky;bottom:72px;z-index:40;margin-top:12px;background:rgba(17,27,48,.96);border:1px solid var(--line2);border-radius:14px;padding:.6rem .7rem;display:flex;gap:.6rem;align-items:center;backdrop-filter:blur(10px)}
@media(min-width:900px){.stick{bottom:12px}}
.cnt b{font-variant-numeric:tabular-nums}

/* equipos */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.team{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.team.over{border-color:var(--cy);background:rgba(6,182,212,.08)}
.team .th{padding:.7rem .85rem;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:.5rem}
.team .th h4{font-size:1.02rem;font-weight:800;color:#67e8f9;flex:1}
.team .ts{font-size:.78rem;color:var(--tx3);display:flex;gap:.6rem}
.team .tb{padding:.7rem .85rem}
.coaches{background:rgba(139,92,246,.13);border-left:4px solid var(--vi);border-radius:8px;padding:.5rem .6rem;margin-bottom:.6rem}
.coaches strong{font-size:.75rem;color:#e9d5ff;display:block;margin-bottom:.3rem;text-transform:uppercase;letter-spacing:.04em}
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.3rem .55rem;margin:2px;border-radius:7px;background:rgba(139,92,246,.18);color:#ede9fe;font-size:.82rem;font-weight:600;cursor:grab;border:1px solid transparent}
.pl{display:flex;align-items:center;gap:.45rem;padding:.42rem .45rem;border-radius:8px;cursor:grab;border:1px solid transparent}
.pl:hover{background:rgba(255,255,255,.05)}
.pl .n{color:#a78bfa;font-weight:800;min-width:20px;font-size:.8rem}
.pl .nm{flex:1;min-width:0;font-weight:600;font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .nm small{display:block;color:var(--tx4);font-size:.7rem;font-weight:500}
.sel{border-color:var(--am)!important;background:rgba(245,158,11,.14)!important}
.moveto{width:100%;margin-top:.5rem;padding:.5rem;border-radius:8px;border:1px dashed var(--am);background:rgba(245,158,11,.08);color:var(--am2);font-weight:800}
.warn{padding:.6rem .75rem;border-radius:10px;background:rgba(251,146,60,.1);color:#fb923c;font-size:.85rem;margin-top:8px}
.info{padding:.6rem .75rem;border-radius:10px;background:rgba(129,230,217,.08);color:#81e6d9;font-size:.85rem}
.ckl{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;padding:.35rem}
.ckl label{display:flex;gap:.5rem;align-items:center;padding:.3rem .35rem;font-size:.86rem;cursor:pointer;border-radius:6px}
.ckl label:hover{background:rgba(255,255,255,.04)}
.ckl input{width:auto}
.nums{display:flex;gap:6px;flex-wrap:wrap}
.nums button{width:40px;height:38px;border-radius:9px;border:1px solid var(--line2);background:transparent;font-weight:800}
.nums button.on{border:2px solid var(--cy);background:rgba(6,182,212,.12)}

/* gira */
.gira-hero{background:linear-gradient(135deg,rgba(6,182,212,.16),rgba(139,92,246,.16));border:1px solid rgba(6,182,212,.35);border-radius:18px;padding:1.1rem 1.2rem;margin-bottom:14px;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.gira-hero .big{font-size:2.4rem;font-weight:900;line-height:1;color:#a5f3fc;font-variant-numeric:tabular-nums}
.tg{border:1px solid var(--line2);background:transparent;border-radius:7px;padding:.25rem .45rem;font-size:.74rem;font-weight:800;color:var(--tx3)}
.tg.on{background:rgba(34,197,94,.2);border-color:var(--gr);color:var(--gr2)}
.va-SI{color:var(--gr2)}.va-NO{color:var(--rd2)}

/* charts */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--tx3);font-size:10px;font-family:Figtree,sans-serif}
.legend{display:flex;gap:.8rem;flex-wrap:wrap;font-size:.75rem;color:var(--tx3);margin-top:.4rem}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.mbox{background:#16213a;border:1px solid rgba(6,182,212,.3);border-radius:18px 18px 0 0;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;padding:1.2rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal{align-items:center}.mbox{border-radius:18px}}
.mbox h3{font-size:1.2rem;font-weight:900;color:#67e8f9;margin-bottom:1rem;display:flex;align-items:center;gap:.5rem}
.mbox h3 .sp{flex:1}
.fg{margin-bottom:.75rem}
.fg label{display:block;font-size:.8rem;font-weight:700;color:var(--tx2);margin-bottom:.3rem}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 .7rem}
.fgrid .full{grid-column:1/-1}
.mact{display:flex;gap:.5rem;margin-top:1rem;flex-wrap:wrap}
.mact .btn{flex:1}
.x{background:none;border:none;font-size:1.4rem;color:var(--tx3);line-height:1}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:200;background:#0e7490;color:#ecfeff;padding:.65rem 1rem;border-radius:12px;font-weight:700;font-size:.9rem;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
.toast.on{opacity:1}.toast.err{background:#991b1b}
.empty{text-align:center;color:var(--tx3);padding:1.6rem .5rem;font-size:.9rem}
.loading{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column;gap:1rem;align-items:center;justify-content:center}
.loading img{width:90px;height:90px;object-fit:contain;animation:pulse 1.4s infinite}
.timeline{display:flex;flex-wrap:wrap;gap:4px}
.timeline span{width:22px;height:22px;border-radius:5px;font-size:.62rem;font-weight:800;display:inline-flex;align-items:center;justify-content:center;color:#0b1222}
.cmt-i{padding:.5rem .6rem;border-radius:9px;background:rgba(255,255,255,.04);margin-bottom:5px;font-size:.86rem}
.cmt-i .h{font-size:.72rem;color:var(--tx3);margin-bottom:2px}
.up{color:var(--gr2)}.dn{color:var(--rd2)}

/* print */
#printArea{display:none}
@media print{
  html,body{background:#fff!important;color:#0f172a!important;padding:0!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;padding:10mm;font-family:Figtree,sans-serif}
  #printArea *{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  @page{margin:8mm}
}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:14px;border-bottom:3px solid #0e7490;padding-bottom:10px}
.ph img{width:60px;height:60px;object-fit:contain}
.ph .a{font-size:22px;font-weight:900;color:#0f172a}.ph .b{font-size:13px;font-weight:700;color:#0e7490}
.ph .c{margin-left:auto;text-align:right;font-size:12px;color:#334155;font-weight:700}
.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pt{border:1.5px solid #0e7490;border-radius:10px;overflow:hidden;break-inside:avoid}
.pt h5{background:#0e7490;color:#fff;font-size:14px;padding:6px 10px;margin:0}
.pt .pc{font-size:11.5px;font-weight:700;color:#5b21b6;background:#ede9fe;padding:5px 10px}
.pt ol{margin:0;padding:6px 10px 8px 30px;font-size:12.5px}
.pt ol li{padding:2px 0;border-bottom:1px solid #e2e8f0}
.ptab{width:100%;border-collapse:collapse;font-size:11.5px}
.ptab th{background:#0e7490;color:#fff;padding:5px 6px;text-align:left;font-size:10.5px;position:static}
.ptab td{padding:4px 6px;border-bottom:1px solid #cbd5e1;color:#0f172a}
.ptab tr:nth-child(even) td{background:#f1f5f9}
</style>
<script>
var ESCUDO_FALLBACK = 'data:image/svg+xml;utf8,' + encodeURIComponent(
 '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 116"><path d="M50 3 L94 16 V56 C94 84 74 103 50 113 C26 103 6 84 6 56 V16 Z" fill="#0e7490" stroke="#a5f3fc" stroke-width="4"/><text x="50" y="66" text-anchor="middle" font-family="Arial" font-weight="900" font-size="28" fill="#fff">RBV</text></svg>');
</script>
</head>
<body>

<div class="loading" id="loading"><img src="escudo.png" onerror="this.src=ESCUDO_FALLBACK"><div class="muted" id="loadingMsg">Cargando base…</div></div>

<header class="top">
  <div class="wrap">
    <img class="escudo" src="escudo.png" alt="Escudo Regatas" onerror="this.src=ESCUDO_FALLBACK">
    <div><div class="t1">Regatas Bella Vista</div><div class="t2">M9 · Camada 2017</div></div>
    <nav class="tabs-top" id="tabsTop"></nav>
    <div class="sync" id="sync" style="margin-left:auto"><i></i><span id="syncTxt">—</span></div>
    <button class="btn sm" onclick="abrirAjustes()" title="Ajustes">⚙️</button>
  </div>
</header>

<main class="wrap">
  <!-- INICIO -->
  <section id="v-inicio"></section>
  <!-- ASISTENCIA -->
  <section id="v-asistencia" class="hidden"></section>
  <!-- EQUIPOS -->
  <section id="v-equipos" class="hidden"></section>
  <!-- PLANTEL -->
  <section id="v-plantel" class="hidden"></section>
  <!-- GIRA -->
  <section id="v-gira" class="hidden"></section>
  <!-- ESTADISTICAS -->
  <section id="v-stats" class="hidden"></section>
</main>

<nav class="nav" id="navBottom"></nav>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="toast" id="toast"></div>
<div id="printArea"></div>

<script>
/* =====================================================================
   CONFIGURACIÓN — pegá acá la URL de tu Apps Script (termina en /exec)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbw3STeF0y6gLe6DfeLqwrk57_quHXv33JFRWevNE9wp4Vy0VzF5lkT0pE6w7vnGLs7w/exec';


const TIPOS = { MIE: 'Miércoles', SAB: 'Sábado', PAR: 'Partido', OTR: 'Otro' };
const TABS = [
  ['inicio', '🏠', 'Inicio'], ['asistencia', '✅', 'Asistencia'], ['equipos', '🧩', 'Equipos'],

/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const hoyISO = () => isoDate(new Date());
const parseISO = s => { const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const fmtF = s => { if (!s) return ''; const p = String(s).slice(0, 10).split('-'); return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : String(s); };
const fmtFC = s => { if (!s) return ''; const d = parseISO(s); return ['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'][d.getDay()] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const MESES = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const colorPct = p => p >= 80 ? 'var(--gr)' : p >= 60 ? 'var(--am)' : 'var(--rd)';
function toast(msg, err) { const t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(() => t.className = 'toast', 2600); }
function setSync(state, txt) { const s = $('sync'); s.className = 'sync ' + (state || ''); $('syncTxt').textContent = txt; }

/* =====================================================================
   CAPA DE DATOS  (API Google Apps Script  |  modo demo local)

let DB = null;
let MODE = 'api';
const apiUrl = () => (lsGet(LS.url) || API_URL || '').trim();

async function cargarBase() {
  MODE = lsGet(LS.mode) === 'demo' ? 'demo' : 'api';
  if (MODE === 'api' && !apiUrl()) { MODE = 'none'; return false; }
  if (MODE === 'demo') {
    let raw = lsGet(LS.demo);
    DB = raw ? JSON.parse(raw) : generarDemo();
    guardarDemo();
    normalizar(); setSync('', 'Modo demo');
    return true;
  }
  setSync('busy', 'Cargando…');
  const pin = lsGet(LS.pin) || '';
  const r = await fetch(apiUrl() + '?action=all&pin=' + encodeURIComponent(pin) + '&t=' + Date.now());
  const j = await r.json();
  if (!j.ok) { setSync('err', 'Error'); throw new Error(j.error || 'Error'); }
  DB = j.data; normalizar(); setSync('', 'Sincronizado');
  return true;
}

function normalizar() {
  ['JUGADORES', 'ENTRENADORES', 'SESIONES', 'ASISTENCIA', 'EQUIPOS', 'GIRA'].forEach(k => DB[k] = DB[k] || []);
  DB.CONFIG = DB.CONFIG || {};
  DB.JUGADORES.forEach(j => {
    j.id = String(j.id); j.nivel = String(j.nivel || '2').toUpperCase();
    j.nivel2 = j.nivel2 === '' || j.nivel2 == null ? null : Number(j.nivel2);
    j.activo = String(j.activo || 'SI').toUpperCase() === 'NO' ? 'NO' : 'SI';
    j.dni = j.dni == null ? '' : String(j.dni);
  });
  DB.ENTRENADORES.forEach(e => {
    e.id = String(e.id); e.hijo_id = e.hijo_id == null || e.hijo_id === '' ? '' : String(e.hijo_id);
    e.activo = String(e.activo || 'SI').toUpperCase() === 'NO' ? 'NO' : 'SI';
    e.asigna_equipos = String(e.asigna_equipos || 'SI').toUpperCase() === 'NO' ? 'NO' : 'SI';
    e.dni = e.dni == null ? '' : String(e.dni);
  });
  DB.SESIONES.forEach(s => { s.id = String(s.id); s.fecha = String(s.fecha).slice(0, 10); });
  DB.ASISTENCIA.forEach(a => { a.sesion_id = String(a.sesion_id); a.persona_id = String(a.persona_id); a.fecha = String(a.fecha).slice(0, 10); a.calif = Number(a.calif || 0); });
  DB.EQUIPOS.forEach(e => { e.grupo_id = String(e.grupo_id); e.persona_id = String(e.persona_id); });
  DB.GIRA.forEach(g => { g.persona_id = String(g.persona_id); g.clave = String(g.clave); });
}

function guardarDemo() { if (MODE === 'demo') lsSet(LS.demo, JSON.stringify(DB)); }

// aplica una operación sobre DB en memoria (misma lógica que el servidor)
function aplicarLocal(op) {
  if (op.sheet === 'CONFIG') { (op.rows || []).forEach(r => { if (r.clave !== 'PIN') DB.CONFIG[r.clave] = r.valor; }); return; }
  const arr = DB[op.sheet];
  if (op.op === 'upsert') {
    op.rows.forEach(r => {
      const i = arr.findIndex(x => String(x[op.key]) === String(r[op.key]));
      if (i >= 0) arr[i] = Object.assign({}, arr[i], r); else arr.push(Object.assign({}, r));
    });
  } else {
    DB[op.sheet] = arr.filter(x => String(x[op.field]) !== String(op.value));
    if (op.op === 'replace') op.rows.forEach(r => DB[op.sheet].push(Object.assign({}, r)));
  }
}

async function guardar(ops, msgOk) {
  ops.forEach(aplicarLocal); normalizar();
  if (MODE === 'demo') { guardarDemo(); if (msgOk) toast(msgOk); return true; }
  setSync('busy', 'Guardando…');
  try {
    const r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pin: lsGet(LS.pin) || '', ops }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    setSync('', 'Guardado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }));
    if (msgOk) toast(msgOk);
    return true;
  } catch (e) {
    setSync('err', 'Sin guardar'); toast('⚠️ No se pudo guardar: ' + e.message, true);
    return false;
  }
}

// cola con demora para cambios chicos (gira, toggles)
let colaOps = [], colaTimer = null;
function encolar(op) {
  aplicarLocal(op); normalizar(); guardarDemo();
  if (MODE === 'demo') return;
  colaOps.push(op); setSync('busy', 'Pendiente…');
  clearTimeout(colaTimer);
  colaTimer = setTimeout(async () => {
    const ops = colaOps; colaOps = [];
    // reenvía sin volver a aplicar localmente
    setSync('busy', 'Guardando…');
    try {
      const r = await fetch(apiUrl(), { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ pin: lsGet(LS.pin) || '', ops }) });
      const j = await r.json(); if (!j.ok) throw new Error(j.error);
      setSync('', 'Guardado ' + new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false }));
    } catch (e) { colaOps = ops.concat(colaOps); setSync('err', 'Sin guardar'); toast('⚠️ No se pudo guardar. Reintento al próximo cambio.', true); }
  }, 900);
}

/* ---------- datos demo (ficticios, nunca datos reales en GitHub) ---------- */
function generarDemo() {
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  const ap = ['Acosta', 'Benítez', 'Castro', 'Díaz', 'Escobar', 'Funes', 'García', 'Herrera', 'Ibáñez', 'Juárez', 'Kramer', 'López', 'Molina', 'Núñez', 'Ortiz', 'Paz', 'Quiroga', 'Ríos', 'Sosa', 'Torres', 'Urquiza', 'Vera', 'Wilson', 'Zabala'];
  const no = ['Bautista', 'Benjamín', 'Felipe', 'Francisco', 'Joaquín', 'Juan', 'Mateo', 'Santiago', 'Tomás', 'Valentín'];
  const col = ['Colegio A', 'Colegio B', 'Colegio C', 'Colegio D', 'Colegio E'];
  const J = [];
  for (let i = 1; i <= 44; i++) {
    const r = rnd(); const nivel = r < .25 ? 'G' : r < .5 ? '1' : r < .85 ? '2' : '3';
    J.push({ id: String(i), nombre: `${ap[i % ap.length]}${i > 24 ? ' ' + ap[(i * 7) % ap.length] : ''}, ${no[(i * 3) % no.length]}`, nivel, nivel2: nivel === 'G' ? [1, 2, 3][Math.floor(rnd() * 3)] : null, colegio: col[Math.floor(rnd() * 5)], grado: rnd() < .5 ? '3ro' : '4to', dni: String(56000000 + i * 1371), fecha_nac: `2017-${pad(1 + (i % 12))}-${pad(1 + (i % 27))}`, activo: i === 44 ? 'NO' : 'SI', fecha_baja: i === 44 ? '2026-08-20' : '', motivo_baja: i === 44 ? 'Se mudó' : '', fecha_alta: '2026-03-01', observaciones: '' });
  }
  const ap2 = ['Coach Ana', 'Coach Beto', 'Coach Caro', 'Coach Dani', 'Coach Edu', 'Coach Fer', 'Coach Gus', 'Coach Hernán'];
  const E = ap2.map((n, i) => ({ id: 'E' + pad(i + 1), apodo: n.split(' ')[1], nombre: n, rol: i < 2 ? 'Head Coach' : i === 7 ? 'Manager' : 'Entrenador', hijo_id: String(3 + i * 5), asigna_equipos: i === 7 ? 'NO' : 'SI', activo: 'SI', fecha_baja: '', motivo_baja: '', dni: String(28000000 + i * 99991), fecha_nac: '1982-05-10', observaciones: '' }));
  const S = [], A = [];
  const d = new Date(2026, 7, 1), fin = new Date(); fin.setDate(fin.getDate() - 1);
  const coment = ['Gran actitud en el contacto', 'Muy buen liderazgo en su equipo', 'Distraído, hablar con los padres', 'Excelente tackle', 'Llegó tarde', 'Ayudó a un compañero nuevo'];
  while (d <= fin) {
    const wd = d.getDay();
    if (wd === 3 || wd === 6) {
      const f = isoDate(d), t = wd === 3 ? 'MIE' : 'SAB', id = f + '_' + t;
      S.push({ id, fecha: f, tipo: t, detalle: '', notas: '', actualizado: f });
      J.forEach(j => {
        if (j.activo === 'NO' && f > j.fecha_baja) return;
        const base = (Number(j.id) % 7 === 0 ? .45 : .82) - (t === 'MIE' ? .1 : 0);
        const P = rnd() < base; const rc = rnd(); const calif = P && rc < .05 ? 1 : P && rc < .07 ? -1 : 0;
        A.push({ sesion_id: id, fecha: f, tipo: t, persona_tipo: 'J', persona_id: j.id, nombre: j.nombre, estado: P ? 'P' : 'A', calif, comentario: calif ? coment[Math.floor(rnd() * coment.length)] : '' });
      });
      E.forEach(e => A.push({ sesion_id: id, fecha: f, tipo: t, persona_tipo: 'E', persona_id: e.id, nombre: e.apodo, estado: rnd() < .8 ? 'P' : 'A', calif: 0, comentario: '' }));
    }
    d.setDate(d.getDate() + 1);
  }
  const G = J.map(j => ({ clave: 'J-' + j.id, persona_tipo: 'J', persona_id: j.id, nombre: j.nombre, va: Number(j.id) % 5 === 0 ? 'NO' : 'SI', rol_gira: 'Jugador', autorizacion: rnd() < .6 ? 'SI' : 'NO', ficha_medica: rnd() < .5 ? 'SI' : 'NO', pago: rnd() < .7 ? 'SI' : 'NO', observaciones: '' }))
    .concat(E.map(e => ({ clave: 'E-' + e.id, persona_tipo: 'E', persona_id: e.id, nombre: e.nombre, va: 'SI', rol_gira: e.rol, autorizacion: 'NO', ficha_medica: 'NO', pago: 'NO', observaciones: '' })));
  return { CONFIG: { CLUB: 'Regatas Bella Vista', DIVISION: 'M9', CAMADA: '2017', TEMPORADA: String(new Date().getFullYear()), GIRA_NOMBRE: 'Gira Tandil (demo)', GIRA_DESDE: '', GIRA_HASTA: '', ESCUDO_URL: 'escudo.png' }, JUGADORES: J, ENTRENADORES: E, SESIONES: S, ASISTENCIA: A, EQUIPOS: [], GIRA: G };
}

/* =====================================================================
   ESTADÍSTICAS (motor)
   ===================================================================== */
function calcStats(filtro) {
  filtro = filtro || {};
  const ses = DB.SESIONES.filter(s =>
    (!filtro.anio || s.fecha.slice(0, 4) === String(filtro.anio)) &&
    (!filtro.mes || Number(s.fecha.slice(5, 7)) === Number(filtro.mes)) &&
    (!filtro.tipo || s.tipo === filtro.tipo));
  const ids = new Set(ses.map(s => s.id));
  const recs = DB.ASISTENCIA.filter(a => ids.has(a.sesion_id)).sort((a, b) => a.fecha.localeCompare(b.fecha));
  const per = {};
  recs.forEach(a => {
    const k = a.persona_tipo + '-' + a.persona_id;
    const p = per[k] || (per[k] = { k, tipo: a.persona_tipo, id: a.persona_id, P: 0, A: 0, MIE: [0, 0], SAB: [0, 0], PAR: [0, 0], up: 0, dn: 0, hist: [] });
    const pr = a.estado === 'P';
    pr ? p.P++ : p.A++;
    if (p[a.tipo]) { p[a.tipo][1]++; if (pr) p[a.tipo][0]++; }
    if (a.calif > 0) p.up++; if (a.calif < 0) p.dn++;
    p.hist.push(a);
  });
  Object.values(per).forEach(p => {
    p.tot = p.P + p.A; p.pct = pct(p.P, p.tot);
    const h = p.hist; let n = 0; const last = h.length ? h[h.length - 1].estado : null;
    for (let i = h.length - 1; i >= 0 && h[i].estado === last; i--) n++;
    p.racha = last ? { e: last, n } : null;
  });
  const porSesion = ses.map(s => {
    const r = recs.filter(a => a.sesion_id === s.id);
    const jp = r.filter(a => a.persona_tipo === 'J' && a.estado === 'P').length, jt = r.filter(a => a.persona_tipo === 'J').length;
    const ep = r.filter(a => a.persona_tipo === 'E' && a.estado === 'P').length;
    return { s, jp, jt, ep };
  }).sort((a, b) => a.s.fecha.localeCompare(b.s.fecha));
  return { ses, recs, per, porSesion };
}

function alertas() {
  const out = [];
  const st = calcStats({ anio: new Date().getFullYear() });
  jugActivos().forEach(j => {
    const p = st.per['J-' + j.id]; if (!p) return;
    if (p.racha && p.racha.e === 'A' && p.racha.n >= 3) out.push({ t: 'rd', j, txt: `${p.racha.n} faltas seguidas` });
    else {
      const ult = p.hist.slice(-8); const pr = ult.filter(a => a.estado === 'P').length;
      if (ult.length >= 6 && pr / ult.length < .5) out.push({ t: 'am', j, txt: `vino ${pr} de las últimas ${ult.length}` });
    }
  });
  return out;
}

function equiposDesdeSesion(sid) { setFuenteEQ('S:' + sid); ir('equipos'); }

function setFuenteEQ(f) {

  const J = jugActivos(), E = entActivos().filter(e => e.asigna_equipos !== 'NO');
  if (f.startsWith('S:')) {

  } else if (f === 'GIRA') {

function fuenteDefault() { const s = sesionesOrd()[0]; return s && s.fecha === hoyISO() ? 'S:' + s.id : 'TODOS'; }

function generarEQ() {
  const pres = jugActivos().filter(j => EQ.presentesJ.has(j.id));
  let n = EQ.n; const equipos = [];
  if (!pres.length) { EQ.equipos = []; return; }
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
  const ord = { G: 0, '1': 1, '2': 2, '3': 3 };
  const porNivel = arr => { const g = {}; arr.forEach(j => (g[j.nivel === 'G' ? 'G' + (j.nivel2 || 9) : j.nivel] = g[j.nivel === 'G' ? 'G' + (j.nivel2 || 9) : j.nivel] || []).push(j)); return Object.keys(g).sort((a, b) => (ord[a[0]] - ord[b[0]]) || a.localeCompare(b)).flatMap(k => shuffle(g[k])); };
  const snake = (lista, eqs) => { let i = 0, dir = 1; lista.forEach(j => { eqs[i].jugadores.push(j); i += dir; if (i === eqs.length) { i = eqs.length - 1; dir = -1; } else if (i < 0) { i = 0; dir = 1; } }); };
  if (EQ.modo === 'por-nivel' && pres.some(j => j.nivel === 'G')) {
    n = Math.max(n, 3);
    equipos.push({ id: 1, nombre: 'Gloriosa A', jugadores: [], entrenadores: [] }, { id: 2, nombre: 'Gloriosa B', jugadores: [], entrenadores: [] });
    snake(porNivel(pres.filter(j => j.nivel === 'G')), equipos.slice(0, 2));
    const resto = Array.from({ length: n - 2 }, (_, i) => ({ id: i + 3, nombre: `Equipo ${i + 3}`, jugadores: [], entrenadores: [] }));
    snake(porNivel(pres.filter(j => j.nivel !== 'G')), resto); equipos.push(...resto);
  } else {
    for (let i = 0; i < n; i++) equipos.push({ id: i + 1, nombre: `Equipo ${i + 1}`, jugadores: [], entrenadores: [] });
    snake(porNivel(pres), equipos);
  }
  // entrenadores: primero con su hijo, el resto repartido parejo
  const ents = entActivos().filter(e => e.asigna_equipos !== 'NO' && EQ.presentesE.has(e.id));
  const sinHijo = [];
  shuffle(ents).forEach(e => {
    const eq = e.hijo_id && equipos.find(q => q.jugadores.some(j => j.id === e.hijo_id));

let DRAG = null;
function dragEQ(ev, t, id, from) { DRAG = { t, id, from }; ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', id); } catch (e) {} }
function dropEQ(ev, to) { ev.preventDefault(); if (!DRAG) return; EQ.sel = DRAG; DRAG = null; moverEQ(to); }
function selEQ(t, id, from) { EQ.sel = EQ.sel && EQ.sel.t === t && EQ.sel.id === id ? null : { t, id, from }; renderEquipos(); }
function moverEQ(to) {
  const s = EQ.sel; if (!s) return;
  const dest = EQ.equipos.find(e => e.id === to); const orig = EQ.equipos.find(e => e.id === s.from);
  const campo = s.t === 'J' ? 'jugadores' : 'entrenadores';
  if (orig) orig[campo] = orig[campo].filter(x => x !== s.id);
  if (!dest[campo].includes(s.id)) dest[campo].push(s.id);
  EQ.sel = null; guardarBorradorEQ(); renderEquipos();
}
function renombrarEQ(id, txt) { const e = EQ.equipos.find(x => x.id === id); if (e && txt.trim()) { e.nombre = txt.trim(); guardarBorradorEQ(); } }
function togglePresEQ(t, id, on) { const s = t === 'J' ? EQ.presentesJ : EQ.presentesE; on ? s.add(id) : s.delete(id); }
function todosEQ(t, on) { const s = t === 'J' ? EQ.presentesJ : EQ.presentesE; s.clear(); if (on) (t === 'J' ? jugActivos() : entActivos()).forEach(x => s.add(x.id)); renderEquipos(); }
function textoEQ() {
  const tit = `🏉 REGATAS M9 · Camada 2017\n${EQ.tipoEvento === 'partido' ? 'PARTIDO' + (EQ.rival ? ' vs ' + EQ.rival : '') : 'ENTRENAMIENTO'} · ${fmtF(EQ.fecha)}\n`;
  return tit + '\n' + EQ.equipos.map(eq => `*${eq.nombre}* (${eq.jugadores.length})\n🧢 ${eq.entrenadores.map(id => entNom(entById(id))).join(', ') || 'Sin asignar'}\n` + eq.jugadores.map((id, i) => `${i + 1}. ${(jugById(id) || {}).nombre || ''}`).join('\n')).join('\n\n');
}
function copiarEQ() {
  const t = textoEQ();
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('📋 Copiado: pegalo en WhatsApp')).catch(() => { prompt('Copiá el texto:', t); });
}
async function guardarEQ() {
  const g = grupoIdEQ();
  const ctx = EQ.fuente === 'GIRA' ? 'Gira' : EQ.fuente.startsWith('S:') ? 'Sesión' : 'Libre';
  const rows = [];
  EQ.equipos.forEach(eq => {
    eq.entrenadores.forEach(id => rows.push({ grupo_id: g, fecha: EQ.fecha, contexto: ctx, equipo: eq.nombre, persona_tipo: 'E', persona_id: id, nombre: entNom(entById(id)) }));
    eq.jugadores.forEach(id => rows.push({ grupo_id: g, fecha: EQ.fecha, contexto: ctx, equipo: eq.nombre, persona_tipo: 'J', persona_id: id, nombre: (jugById(id) || {}).nombre || '' }));
  });
  await guardar([{ op: 'replace', sheet: 'EQUIPOS', field: 'grupo_id', value: g, rows }], '💾 Equipos guardados en la planilla');
  renderEquipos();
}
function cargarGuardadoEQ(silencioso) {

    <div class="card"><h3>🏫 Asistencia por colegio</h3>
      ${cols.length ? cols.map(c => `<div class="list-i"><span class="grow">${esc(c.c)} <span class="muted small">(${c.n})</span></span><div class="bar" style="width:120px"><i style="width:${c.pc}%;background:${colorPct(c.pc)}"></i></div><b style="width:44px;text-align:right">${c.pc}%</b></div>`).join('') : '<div class="empty">Sin datos.</div>'}
    </div>
  </div>`;
}
function ordenST(k) { if (ST.orden === k) ST.desc = !ST.desc; else { ST.orden = k; ST.desc = k !== 'nombre'; } renderStats(); }
function chartSesiones(pj) {
  if (!pj.length) return '<div class="empty">Sin sesiones en el período.</div>';
  const W = 600, H = 200, pl = 28, pb = 22, max = Math.max(...pj.map(x => x.jt), 1);
  const bw = (W - pl) / pj.length; const col = { MIE: '#06b6d4', SAB: '#8b5cf6', PAR: '#f59e0b', OTR: '#94a3b8' };
  const y = v => H - pb - (v / max) * (H - pb - 10);
  let g = '';
  [0, .5, 1].forEach(t => { const v = Math.round(max * t); g += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,.08)"/><text x="${pl - 4}" y="${y(v) + 3}" text-anchor="end">${v}</text>`; });
  pj.forEach((x, i) => {
    const bx = pl + i * bw + bw * .15, w = Math.max(bw * .7, 2);
    g += `<rect x="${bx}" y="${y(x.jt)}" width="${w}" height="${H - pb - y(x.jt)}" rx="2" fill="rgba(255,255,255,.06)"/><rect x="${bx}" y="${y(x.jp)}" width="${w}" height="${H - pb - y(x.jp)}" rx="2" fill="${col[x.s.tipo] || '#94a3b8'}"><title>${fmtFC(x.s.fecha)}: ${x.jp}/${x.jt} (${pct(x.jp, x.jt)}%)</title></rect>`;
    if (pj.length <= 16 || i % Math.ceil(pj.length / 12) === 0) g += `<text x="${bx + w / 2}" y="${H - 6}" text-anchor="middle">${x.s.fecha.slice(8, 10)}/${x.s.fecha.slice(5, 7)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Presentes por sesión">${g}</svg>`;
}
function chartMeses(meses, mes) {
  if (!meses.length) return '<div class="empty">Sin datos.</div>';
  const W = 600, H = 200, pb = 22; const bw = W / meses.length;
  let g = `<line x1="0" x2="${W}" y1="${H - pb - (H - pb - 14) * .8}" y2="${H - pb - (H - pb - 14) * .8}" stroke="rgba(34,197,94,.35)" stroke-dasharray="4 4"/><text x="${W - 2}" y="${H - pb - (H - pb - 14) * .8 - 4}" text-anchor="end">80%</text>`;
  meses.forEach((m, i) => {
    const p = pct(...mes[m]); const h = (H - pb - 14) * p / 100; const bx = i * bw + bw * .2, w = bw * .6;
    g += `<rect x="${bx}" y="${H - pb - h}" width="${w}" height="${h}" rx="4" fill="${p >= 80 ? '#22c55e' : p >= 60 ? '#f59e0b' : '#ef4444'}"/><text x="${bx + w / 2}" y="${H - pb - h - 4}" text-anchor="middle" style="fill:#f1f5f9;font-weight:700">${p}%</text><text x="${bx + w / 2}" y="${H - 6}" text-anchor="middle">${MESES[Number(m.slice(5, 7)) - 1]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Asistencia por mes">${g}</svg>`;
}
function fichaPersona(t, id) {
  const x = t === 'J' ? jugById(id) : entById(id); if (!x) return;
  const anio = new Date().getFullYear();
  const S = calcStats({ anio }); const p = S.per[t + '-' + id] || { P: 0, A: 0, tot: 0, pct: 0, MIE: [0, 0], SAB: [0, 0], PAR: [0, 0], up: 0, dn: 0, hist: [], racha: null };
  const coms = p.hist.filter(a => a.calif !== 0 || a.comentario).reverse();
  const hijo = t === 'E' && jugById(x.hijo_id);
  const padres = t === 'J' ? DB.ENTRENADORES.filter(e => e.hijo_id === id) : [];
  abrirModal(`<h3>${t === 'J' ? '👦' : '🧢'} ${esc(t === 'J' ? x.nombre : entNom(x))}<span class="sp"></span><button class="x" onclick="cerrarModal()">×</button></h3>
  <div class="row small muted" style="margin:-6px 0 12px">${t === 'J' ? `${nivelBadge(x)} ${esc(x.colegio)} · ${esc(x.grado)}${padres.length ? ' · 🧢 ' + padres.map(entNom).map(esc).join(', ') : ''}` : `${esc(x.rol || '')}${hijo ? ' · hijo: ' + esc(hijo.nombre) : ''}`} ${viaja(t, id) ? '· ✈️ viaja a la gira' : ''} ${x.activo === 'NO' ? '· <b>baja ' + fmtF(x.fecha_baja) + '</b>' : ''}</div>
  <div class="kpis">
    <div class="kpi"><div class="l">Asistencia ${anio}</div><div class="v" style="color:${colorPct(p.pct)}">${p.tot ? p.pct + '%' : '—'}</div><div class="s">${p.P} de ${p.tot}</div></div>
    <div class="kpi"><div class="l">Mié / Sáb</div><div class="v" style="font-size:1.2rem">${p.MIE[1] ? pct(...p.MIE) + '%' : '—'} / ${p.SAB[1] ? pct(...p.SAB) + '%' : '—'}</div></div>
    <div class="kpi"><div class="l">Marcas</div><div class="v" style="font-size:1.3rem"><span class="up">▲${p.up}</span> <span class="dn">▼${p.dn}</span></div></div>
  </div>
  <div class="card"><h3>🗓️ Sesión por sesión</h3><div class="timeline">${p.hist.map(a => `<span style="background:${a.estado === 'P' ? 'var(--gr)' : 'var(--rd)'}" title="${fmtFC(a.fecha)} ${TIPOS[a.tipo] || ''}${a.comentario ? ': ' + esc(a.comentario) : ''}">${a.calif > 0 ? '▲' : a.calif < 0 ? '▼' : a.fecha.slice(8, 10)}</span>`).join('') || '<span class="muted small" style="width:auto;color:var(--tx3)">Sin registros</span>'}</div></div>
  <div class="card"><h3>⭐ Destacados y comentarios</h3>${coms.length ? coms.map(a => `<div class="cmt-i"><div class="h">${fmtFC(a.fecha)} · ${TIPOS[a.tipo] || ''}</div>${a.calif > 0 ? '<b class="up">▲</b> ' : a.calif < 0 ? '<b class="dn">▼</b> ' : '💬 '}${esc(a.comentario || '(sin comentario)')}</div>`).join('') : '<div class="empty">Nada marcado todavía.</div>'}</div>
  ${x.observaciones ? `<div class="info">📝 ${esc(x.observaciones)}</div>` : ''}
  <div class="mact"><button class="btn" onclick="cerrarModal();${t === 'J' ? `editarJugador('${id}')` : `editarEntrenador('${id}')`}">✏️ Editar datos</button></div>`);
}
const fichaJugador = id => fichaPersona('J', id), fichaEntrenador = id => fichaPersona('E', id);
function exportarCSV() {
  const S = calcStats({ anio: ST.anio, mes: ST.mes, tipo: ST.tipo });
  const rows = [['tipo', 'id', 'nombre', 'nivel', 'colegio', 'presentes', 'ausentes', 'pct', 'pct_mie', 'pct_sab', 'positivos', 'a_mejorar', 'activo', 'viaja_gira']];
  DB.JUGADORES.forEach(j => { const p = S.per['J-' + j.id] || { P: 0, A: 0, pct: 0, MIE: [0, 0], SAB: [0, 0], up: 0, dn: 0 }; rows.push(['Jugador', j.id, j.nombre, nivelTxt(j), j.colegio, p.P, p.A, p.pct, p.MIE[1] ? pct(...p.MIE) : '', p.SAB[1] ? pct(...p.SAB) : '', p.up, p.dn, j.activo, viaja('J', j.id) ? 'SI' : 'NO']); });
  DB.ENTRENADORES.forEach(e => { const p = S.per['E-' + e.id] || { P: 0, A: 0, pct: 0, MIE: [0, 0], SAB: [0, 0], up: 0, dn: 0 }; rows.push(['Entrenador', e.id, entNom(e), e.rol, '', p.P, p.A, p.pct, p.MIE[1] ? pct(...p.MIE) : '', p.SAB[1] ? pct(...p.SAB) : '', p.up, p.dn, e.activo, viaja('E', e.id) ? 'SI' : 'NO']); });
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `M9_estadisticas_${ST.anio}${ST.mes ? '_' + pad(ST.mes) : ''}.csv`; a.click();
}

/* =====================================================================
   AJUSTES / CONEXIÓN / PIN
   ===================================================================== */
function abrirAjustes(primeraVez, error) {
  abrirModal(`<h3>${primeraVez ? '🏉 Bienvenido' : '⚙️ Ajustes y conexión'}<span class="sp"></span>${primeraVez ? '' : '<button class="x" onclick="cerrarModal()">×</button>'}</h3>
  ${error ? `<div class="warn" style="margin:0 0 12px">⚠️ ${esc(error)}</div>` : ''}
  <div class="fg"><label>URL de la planilla (Apps Script, termina en /exec)</label><input id="cfUrl" value="${esc(apiUrl())}" placeholder="https://script.google.com/macros/s/…/exec"></div>
  <div class="fg"><label>PIN de acceso</label><input id="cfPin" type="password" inputmode="numeric" value="${esc(lsGet(LS.pin) || '')}" placeholder="PIN"></div>
  <div class="mact"><button class="btn pri" onclick="conectar()">🔗 Conectar con Google Sheet</button></div>
  <div class="mact"><button class="btn" onclick="entrarDemo()">🧪 ${MODE === 'demo' ? 'Seguir en' : 'Probar en'} modo demo (datos ficticios)</button></div>
  ${MODE === 'demo' ? `<div class="mact"><button class="btn sm red" onclick="if(confirm('¿Reiniciar los datos demo?')){lsDel(LS.demo);location.reload()}">↺ Reiniciar datos demo</button></div>` : ''}
  ${MODE === 'api' && !primeraVez ? `<div class="mact"><button class="btn sm" onclick="cerrarModal();recargar()">🔄 Recargar datos de la planilla</button><button class="btn sm red" onclick="lsDel(LS.pin);location.reload()">🔒 Cerrar sesión</button></div>` : ''}
  <p class="small muted" style="margin-top:12px">Modo actual: <b>${MODE === 'demo' ? 'Demo (local, este navegador)' : MODE === 'api' ? 'Google Sheet' : 'sin configurar'}</b></p>`);
}
async function conectar() {
  const u = $('cfUrl').value.trim(), p = $('cfPin').value.trim();
  if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)) return toast('La URL tiene que ser la del Apps Script (/exec)', true);
  lsSet(LS.url, u); lsSet(LS.pin, p); lsSet(LS.mode, 'api'); cerrarModal(); iniciar();
}
function entrarDemo() { lsSet(LS.mode, 'demo'); cerrarModal(); iniciar(); }
async function recargar() { try { await cargarBase(); renderTab(); toast('🔄 Datos actualizados'); } catch (e) { toast(e.message, true); } }

async function iniciar() {
  $('loading').classList.remove('hidden'); $('loadingMsg').textContent = 'Cargando base…';
  try {
    const ok = await cargarBase();
    $('loading').classList.add('hidden');
    if (!ok) { abrirAjustes(true); return; }
    document.querySelectorAll('img.escudo').forEach(i => { if (DB.CONFIG.ESCUDO_URL) i.src = DB.CONFIG.ESCUDO_URL; });
    renderNav(); ir(lsGet(LS.tab) || 'inicio');
  } catch (e) {
    $('loading').classList.add('hidden');
    abrirAjustes(true, /PIN/i.test(e.message) ? 'PIN incorrecto. Probá de nuevo.' : 'No se pudo leer la planilla: ' + e.message);
  }
}
window.addEventListener('beforeunload', e => { if ((AS && AS.sucio) || colaOps.length) { e.preventDefault(); e.returnValue = ''; } });
iniciar();
</script>
